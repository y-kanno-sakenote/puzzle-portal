<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>みちつなぎ</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#dedcd6; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --thick:#5d5952;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:420px;margin:0 auto;padding:10px 10px 40px}
  header{display:flex;align-items:baseline;gap:8px;padding:2px 2px 8px}
  #title{font-size:20px;font-weight:700;letter-spacing:.02em}

  #rules{padding:0 2px 10px;font-size:13px;line-height:1.7;color:var(--sub)}
  #rules div{white-space:nowrap}

  #stage{position:relative}
  #board{
    position:relative;
    width:100%;max-width:400px;margin:0 auto;aspect-ratio:1/1;
    background:var(--panel);border:2px solid var(--thick);border-radius:6px;
    overflow:hidden;
    touch-action:none;                 /* 盤の上だけページを動かさない */
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  #buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px}
  button{
    font:inherit;padding:11px 0;border:1px solid var(--frame);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{background:#eeece7}
  button:disabled{opacity:.4;cursor:default}

  #msg{height:22px;padding:8px 2px 0;font-size:14px;color:var(--sub);text-align:center}

  #clear{
    position:absolute;left:0;right:0;top:0;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(245,244,241,.93);border-radius:6px;z-index:20;
  }
  #clear[hidden]{display:none}
  #clearTitle{font-size:26px;font-weight:700}
  #next{font-size:17px;padding:12px 28px}

  #levels{padding-top:18px}
  .tier{margin-bottom:10px}
  .tierName{font-size:13px;color:var(--sub);padding:2px 2px 4px}
  .tierRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .lv{padding:0;height:40px;font-size:14px;border-radius:7px;
      display:flex;align-items:center;justify-content:center}
  .lv.cur{border-color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><div id="title">入門 1</div></header>

  <div id="rules">
    <div>同じ数字どうしを線でつなぐ</div>
    <div>線は交差させない・重ねない</div>
    <div>盤の全部のマスを通る</div>
  </div>

  <div id="stage">
    <div id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="clear" hidden>
      <div id="clearTitle">クリア！</div>
      <button id="next">つぎへ</button>
    </div>
  </div>

  <div id="buttons">
    <button id="undo">もどす</button>
    <button id="reset">はじめから</button>
  </div>
  <div id="msg"></div>

  <section id="levels"></section>
</div>

/* PUZZLES-END */

var MichiTsunagi = (function () {

  var DIGITS = "123456789abcdefghijklmnopqrstuvwxyz";
  var NBCACHE = {};

  /* 4近傍の表（盤の大きさごとに一度だけ作る） */
  function neighbors(n) {
    if (NBCACHE[n]) return NBCACHE[n];
    var out = [], i, r, c, a;
    for (i = 0; i < n * n; i++) {
      r = Math.floor(i / n); c = i % n; a = [];
      if (r > 0) a.push(i - n);
      if (r + 1 < n) a.push(i + n);
      if (c > 0) a.push(i - 1);
      if (c + 1 < n) a.push(i + 1);
      out.push(a);
    }
    NBCACHE[n] = out;
    return out;
  }

  /* 問題 -> {n, N, pairs, sol:[各マスが属する対], endPair:[数字マスなら対番号 / なければ -1], nb} */
  function parse(p) {
    var n = p.n, N = n * n, sol = [], endPair = [], i, k;
    for (i = 0; i < N; i++) {
      sol.push(DIGITS.indexOf(p.solution.charAt(i)));
      endPair.push(-1);
    }
    for (k = 0; k < p.pairs.length; k++) {
      endPair[p.pairs[k][0]] = k;
      endPair[p.pairs[k][1]] = k;
    }
    return { n: n, N: N, pairs: p.pairs, sol: sol, endPair: endPair, nb: neighbors(n) };
  }

  /* 引かれている道が「答え」になっているか。
       isComplete(p, paths) でも isComplete({p:p, paths:paths}) でも呼べる
     paths[k] は対 k の道（マス番号を通る順に並べた配列）
     何が違うかは言わない（画面は「できたか / まだか」しか使わない） */
  function isComplete(a, b) {
    var p = a, paths = b;
    if (b === undefined && a && a.p) { p = a.p; paths = a.paths; }
    if (!p || !paths) return false;
    var d = parse(p), n = d.n, N = d.N, K = d.pairs.length;
    if (paths.length !== K) return false;
    var own = [], i, k, j, path, s, e;
    for (i = 0; i < N; i++) own.push(-1);
    for (k = 0; k < K; k++) {
      path = paths[k];
      if (!path || path.length < 2) return false;
      s = path[0]; e = path[path.length - 1];
      /* 両端がその対の数字マスであること（どちらから引いたかは問わない） */
      if (!((s === d.pairs[k][0] && e === d.pairs[k][1]) ||
            (s === d.pairs[k][1] && e === d.pairs[k][0]))) return false;
      for (j = 0; j < path.length; j++) {
        i = path[j];
        if (!Number.isInteger(i) || i < 0 || i >= N) return false;
        if (own[i] !== -1) return false;                 /* 交差・重なり */
        own[i] = k;
        if (j > 0 && d.nb[path[j - 1]].indexOf(i) < 0) return false;  /* 縦横でつながっていない */
      }
    }
    for (i = 0; i < N; i++) if (own[i] === -1) return false;  /* 通っていないマスがある */
    return true;
  }

  /* 解を limit 個まで数える（生成器 tools/gen_puzzles.py と同じ枝刈り）
       ・空きマスは必ず道の途中になる＝伸ばせる先が2つ要る
       ・「空きマス＋まだ動ける端点」の連結を見て、未完の対が分断されたら打ち切る */
  function countSolutions(p, limit) {
    limit = limit || 2;
    var d = parse(p), n = d.n, N = d.N, nb = d.nb, endPair = d.endPair, K = d.pairs.length;
    var A = [], B = [], occ = [], i, k;
    for (i = 0; i < N; i++) occ.push(0);
    for (k = 0; k < K; k++) {
      A.push(d.pairs[k][0]); B.push(d.pairs[k][1]);
      occ[A[k]] = 1; occ[B[k]] = 1;
    }
    var stamp = [], comp = [], queue = [];
    for (i = 0; i < N; i++) { stamp.push(0); comp.push(-1); queue.push(0); }
    var mark = 0, cnt = 0, empties = N - 2 * K, curK = 0, curHead = A[0];

    function avail(c) {
      return occ[c] === 0 || c === curHead || c === B[curK] || endPair[c] > curK;
    }
    function isOpen(c) {
      return c === curHead || c === B[curK] || endPair[c] > curK;
    }
    function degBad(c) {
      var a = nb[c], t = 0, j;
      for (j = 0; j < a.length; j++) if (avail(a[j])) t++;
      return t < 2;
    }
    function scan(c) {
      var a = nb[c], j;
      for (j = 0; j < a.length; j++) if (occ[a[j]] === 0 && degBad(a[j])) return false;
      return true;
    }
    function ok(dropA, dropB) {
      var i, j, v, c, head, tail, id, nc, hasOpen, a;
      if (dropA < 0) {
        for (i = 0; i < N; i++) if (occ[i] === 0 && degBad(i)) return false;
      } else {
        if (!scan(dropA)) return false;
        if (dropB >= 0 && !scan(dropB)) return false;
      }
      mark++;
      nc = 0;
      for (i = 0; i < N; i++) {
        if (stamp[i] === mark || !avail(i)) continue;
        id = nc++; head = 0; tail = 0; hasOpen = false;
        queue[tail++] = i; stamp[i] = mark; comp[i] = id;
        while (head < tail) {
          c = queue[head++];
          if (isOpen(c)) hasOpen = true;
          a = nb[c];
          for (j = 0; j < a.length; j++) {
            v = a[j];
            if (stamp[v] !== mark && avail(v)) { stamp[v] = mark; comp[v] = id; queue[tail++] = v; }
          }
        }
        if (!hasOpen) return false;      /* どの端点にも触れない空きの島 */
      }
      if (comp[curHead] !== comp[B[curK]]) return false;
      for (j = curK + 1; j < K; j++) if (comp[A[j]] !== comp[B[j]]) return false;
      return true;
    }

    function dfs(k, head) {
      var a = nb[head], i, v, ph;
      for (i = 0; i < a.length; i++) {
        if (cnt >= limit) return;
        v = a[i];
        if (v === B[k]) {
          if (k + 1 === K) {
            if (empties === 0) cnt++;
          } else {
            curK = k + 1; curHead = A[k + 1];
            if (ok(head, B[k])) dfs(k + 1, A[k + 1]);
            curK = k; curHead = head;
          }
        } else if (occ[v] === 0) {
          occ[v] = 1; empties--;
          ph = curHead; curHead = v;
          if (ok(head, -1)) dfs(k, v);
          curHead = ph; occ[v] = 0; empties++;
        }
      }
    }

    if (K === 0) return 0;
    if (!ok(-1, -1)) return 0;
    dfs(0, A[0]);
    return cnt;
  }

  return {
    PUZZLES: PUZZLES, DIGITS: DIGITS,
    parse: parse, neighbors: neighbors,
    isComplete: isComplete, countSolutions: countSolutions
  };
})();

if (typeof window !== 'undefined') window.MichiTsunagi = MichiTsunagi;
if (typeof globalThis !== 'undefined') globalThis.MichiTsunagi = MichiTsunagi;
</script>

  function loadSave() {

      var o = JSON.parse(raw);

      if (o.cleared && typeof o.cleared === 'object') save.cleared = o.cleared;

      if (o.paths && typeof o.paths === 'object') save.paths = o.paths;
    } catch (e) { save = { cleared: {}, last: 0, paths: {} }; }
  }
  function storeSave() {
    try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
  }

  /* ---- 状態 ---- */
  var index = 0, p = null, d = null, n = 0, N = 0, K = 0;
  var paths = [];          /* paths[k] = 対 k の道（通る順のマス番号） */
  var owner = [];          /* owner[マス] = そこを通っている対 / -1 */
  var history = [];
  var finished = false;
  var lines = [], dots = [], texts = [];
  var drag = null;

  /* ---- 道の書き出し・読み込み（保存用の1本の文字列） ---- */
  function encode() {
    var out = [], k;
    for (k = 0; k < K; k++) out.push(paths[k].join('.'));
    return out.join('|');
  }
  function decode(s) {
    if (typeof s !== 'string') return null;
    var parts = s.split('|'), out = [], k, j, cells, v;
    if (parts.length !== K) return null;
    for (k = 0; k < K; k++) {
      cells = [];
      if (parts[k].length) {
        var t = parts[k].split('.');
        for (j = 0; j < t.length; j++) {
          v = parseInt(t[j], 10);
          if (!Number.isInteger(v) || v < 0 || v >= N) return null;
          cells.push(v);
        }
      }
      out.push(cells);
    }
    return out;
  }

  function reown() {
    var i, k, j;
    for (i = 0; i < N; i++) owner[i] = -1;
    for (k = 0; k < K; k++) for (j = 0; j < paths[k].length; j++) owner[paths[k][j]] = k;
  }

  /* 引いた道が矛盾なく読めるか（保存の読み戻し用の軽い点検） */
  function sane(cand) {
    var seen = [], k, j, i, prev;
    for (i = 0; i < N; i++) seen.push(-1);
    for (k = 0; k < K; k++) {
      var path = cand[k];
      if (path.length === 1) return false;
      if (path.length && d.endPair[path[0]] !== k) return false;
      for (j = 0; j < path.length; j++) {
        i = path[j];
        if (seen[i] !== -1) return false;
        if (d.endPair[i] >= 0 && d.endPair[i] !== k) return false;
        if (j > 0 && d.nb[prev].indexOf(i) < 0) return false;
        seen[i] = k; prev = i;
      }
    }
    return true;
  }

  /* ---- 盤を組む ---- */
  function buildBoard() {
    while (elSvg.firstChild) elSvg.removeChild(elSvg.firstChild);
    elSvg.setAttribute('viewBox', '0 0 ' + n + ' ' + n);
    lines = []; dots = []; texts = [];
    var i, k, e;

    /* 目盛りの線。vector-effect は継承されないので1本ずつ付ける
       （付け忘れると 1 = 1マス幅になって盤が塗りつぶされる） */
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('stroke', 'rgba(0,0,0,.10)');
    function gline(x1, y1, x2, y2) {
      var e = document.createElementNS(SVGNS, 'line');
      e.setAttribute('x1', x1); e.setAttribute('y1', y1);
      e.setAttribute('x2', x2); e.setAttribute('y2', y2);
      e.setAttribute('stroke-width', '1');
      e.setAttribute('vector-effect', 'non-scaling-stroke');
      g.appendChild(e);
    }
    for (i = 1; i < n; i++) { gline(i, 0, i, n); gline(0, i, n, i); }
    elSvg.appendChild(g);

    for (k = 0; k < K; k++) {
      e = document.createElementNS(SVGNS, 'polyline');
      e.setAttribute('fill', 'none');
      e.setAttribute('stroke', PALETTE[k % PALETTE.length]);
      e.setAttribute('stroke-width', '0.3');
      e.setAttribute('stroke-linecap', 'round');
      e.setAttribute('stroke-linejoin', 'round');
      elSvg.appendChild(e);
      lines.push(e);
    }
    for (k = 0; k < K; k++) {
      var two = d.pairs[k], m;
      for (m = 0; m < 2; m++) {
        var c = two[m], x = (c % n) + 0.5, y = Math.floor(c / n) + 0.5;
        e = document.createElementNS(SVGNS, 'circle');
        e.setAttribute('cx', x); e.setAttribute('cy', y); e.setAttribute('r', 0.34);
        e.setAttribute('fill', PALETTE[k % PALETTE.length]);
        e.setAttribute('stroke', '#fff');
        e.setAttribute('stroke-width', '0.05');
        elSvg.appendChild(e);
        dots.push(e);
        var t = document.createElementNS(SVGNS, 'text');
        t.setAttribute('x', x); t.setAttribute('y', y);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.setAttribute('font-size', '0.4');
        t.setAttribute('font-weight', '700');
        t.setAttribute('fill', '#fff');
        t.textContent = String(k + 1);
        elSvg.appendChild(t);
        texts.push(t);
      }
    }
  }

  function render() {
    var k, j, pts;
    for (k = 0; k < K; k++) {
      pts = [];
      for (j = 0; j < paths[k].length; j++) {
        var c = paths[k][j];
        pts.push(((c % n) + 0.5) + ',' + (Math.floor(c / n) + 0.5));
      }
      lines[k].setAttribute('points', pts.join(' '));
    }
    elUndo.disabled = finished || !history.length;
  }

  function persist() {
    save.paths[String(index)] = encode();
    save.last = index;
    storeSave();
  }

  /* ---- 出題 ---- */
  function loadLevel(i) {
    index = i;
    p = PUZZLES[i];
    d = MichiTsunagi.parse(p);
    n = d.n; N = d.N; K = d.pairs.length;
    paths = [];
    for (var k = 0; k < K; k++) paths.push([]);
    var got = decode(save.paths && save.paths[String(i)]);
    if (got && sane(got)) paths = got;
    owner = [];
    reown();
    history = [];
    finished = false;
    drag = null;
    elClear.hidden = true;
    elTitle.textContent = LABELS[i].text;
    elMsg.textContent = '';
    buildBoard();
    render();
    renderLevelList();
    save.last = i;
    storeSave();
  }

  /* ---- 操作 ---- */
  function snapshot() {
    var k, copy = [];
    for (k = 0; k < K; k++) copy.push(paths[k].slice());
    history.push(copy);
    if (history.length > 200) history.shift();
  }

  /* 指の位置からマス番号。盤の外へ1マス以上はみ出したら -1（そこで伸びを止める） */
  function cellAt(x, y) {
    var r = elSvg.getBoundingClientRect();
    if (!r.width) return -1;
    var cs = r.width / n;
    var c = Math.floor((x - r.left) / cs), rw = Math.floor((y - r.top) / cs);
    if (c < -1 || c > n || rw < -1 || rw > n) return -1;
    if (c < 0) c = 0; if (c > n - 1) c = n - 1;
    if (rw < 0) rw = 0; if (rw > n - 1) rw = n - 1;
    return rw * n + c;
  }

  function isDone(k) {
    var path = paths[k];
    if (path.length < 2) return false;
    var a = d.pairs[k][0], b = d.pairs[k][1], s = path[0], e = path[path.length - 1];
    return (s === a && e === b) || (s === b && e === a);
  }

  /* 隣のマス nx へ1歩。進めたら true */
  function step(nx) {
    var k = drag.k, path = paths[k], at = path.indexOf(nx);
    if (at >= 0) {                     /* 自分の道の上＝そこから先を消して引き返す */
      path.length = at + 1;
      reown();
      return true;
    }
    if (d.endPair[nx] >= 0 && d.endPair[nx] !== k) return false;  /* 他の対の数字マス */
    if (isDone(k)) return false;                                  /* もうつながっている */
    var m = owner[nx];
    if (m >= 0 && m !== k) {
      paths[m].length = paths[m].indexOf(nx);          /* 先客はその点から先を消す */
      if (paths[m].length < 2) paths[m] = [];          /* 数字1つだけの残骸は残さない */
    }
    path.push(nx);
    reown();
    return true;
  }

  /* 指の位置まで、縦横に分解して1マスずつ追いかける */
  function driveTo(t) {
    var guard = 0;
    while (drag.cur !== t && guard++ < 4 * N) {
      var cr = Math.floor(drag.cur / n), cc = drag.cur % n;
      var tr = Math.floor(t / n), tc = t % n;
      var dr = tr - cr, dc = tc - cc, nx;
      /* 斜めに動いたら、残りの大きい方の向きから片づける */
      if (Math.abs(dr) >= Math.abs(dc)) nx = drag.cur + (dr > 0 ? n : -n);
      else nx = drag.cur + (dc > 0 ? 1 : -1);
      if (!step(nx)) break;
      drag.cur = paths[drag.k][paths[drag.k].length - 1];
      if (drag.cur !== nx) break;
    }
  }

  function beginStroke() {
    if (drag.applied) return;
    snapshot();
    if (drag.fromEnd) paths[drag.k] = [drag.start];
    else paths[drag.k].length = paths[drag.k].indexOf(drag.start) + 1;
    reown();
    drag.applied = true;
    drag.cur = drag.start;
  }

  elBoard.addEventListener('pointerdown', function (e) {
    if (finished) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    var ep = d.endPair[i], ow = owner[i], k;
    if (ep >= 0) k = ep;
    else if (ow >= 0) k = ow;
    else return;                        /* 空きマスからは引けない */
    e.preventDefault();
    try { elBoard.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { k: k, start: i, cur: i, fromEnd: (ep >= 0), moved: false, applied: false };
  });

  elBoard.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0 || i === drag.cur) return;
    e.preventDefault();
    beginStroke();
    drag.moved = true;
    driveTo(i);
    render();
  });

  function endDrag() {
    if (!drag) return;
    var k = drag.k, moved = drag.moved, fromEnd = drag.fromEnd, applied = drag.applied;
    drag = null;                        /* 離した位置がそのまま確定。戻さない */
    if (!moved) {
      /* 数字のマスをタップ＝その対の道を全部消す */
      if (fromEnd && paths[k].length) {
        snapshot();
        paths[k] = [];
        reown();
        render();
        persist();
      }
      return;
    }
    if (applied && paths[k].length === 1) { paths[k] = []; reown(); }
    render();
    persist();
    judge();
  }
  elBoard.addEventListener('pointerup', endDrag);
  elBoard.addEventListener('pointercancel', endDrag);

  /* 全マスが埋まり全対がつながった瞬間だけクリア（途中では何も言わない） */
  function judge() {
    if (!MichiTsunagi.isComplete(p, paths)) return;
    finished = true;
    save.cleared[String(index)] = 1;
    persist();
    renderLevelList();
    render();
    elNext.hidden = (index >= PUZZLES.length - 1);
    elClear.hidden = false;
  }

  elUndo.addEventListener('click', function () {
    if (finished || !history.length) return;
    paths = history.pop();
    reown();
    render();
    persist();
  });
  elReset.addEventListener('click', function () {
    snapshot();
    paths = [];
    for (var k = 0; k < K; k++) paths.push([]);
    reown();
    finished = false;
    elClear.hidden = true;
    render();
    persist();
  });
  elNext.addEventListener('click', function () {
    if (index < PUZZLES.length - 1) { loadLevel(index + 1); window.scrollTo(0, 0); }
  });

  /* ---- レベル一覧 ---- */
  function renderLevelList() {
    if (!elLevels.childNodes.length) {
      var tiers = [], seen = {}, i;
      for (i = 0; i < LABELS.length; i++) {
        if (!seen[LABELS[i].tier]) { seen[LABELS[i].tier] = []; tiers.push(LABELS[i].tier); }
        seen[LABELS[i].tier].push(i);
      }
      for (var t = 0; t < tiers.length; t++) {
        var box = document.createElement('div');
        box.className = 'tier';
        var name = document.createElement('div');
        name.className = 'tierName';
        name.textContent = tiers[t];
        box.appendChild(name);
        var row = document.createElement('div');
        row.className = 'tierRow';
        var idxs = seen[tiers[t]];
        for (var k = 0; k < idxs.length; k++) {
          var b = document.createElement('button');
          b.className = 'lv';
          b.dataset.idx = String(idxs[k]);
          b.addEventListener('click', function () {
            loadLevel(parseInt(this.dataset.idx, 10));
            window.scrollTo(0, 0);
          });
          row.appendChild(b);
        }
        box.appendChild(row);
        elLevels.appendChild(box);
      }
    }
    var btns = elLevels.querySelectorAll('.lv');
    for (var j = 0; j < btns.length; j++) {
      var idx = parseInt(btns[j].dataset.idx, 10);
      btns[j].textContent = LABELS[idx].no + (save.cleared[String(idx)] ? ' ✓' : '');
      btns[j].className = 'lv' + (idx === index ? ' cur' : '');
    }
  }

  loadSave();
  loadLevel(save.last);
})();
</script>
</body>
</html>
