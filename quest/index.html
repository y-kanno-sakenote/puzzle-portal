<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クエスト</title>
<style>
  :root{--bg:#f5f4f1;--panel:#fff;--ink:#222;--sub:#6b6b6b;--frame:#c9c6be}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
  .screen{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:0 auto;padding:22px 14px 60px;text-align:center}
  .screen[hidden]{display:none}
  h1{font-size:30px;margin:0 0 36px}
  .big{display:block;width:100%;padding:22px 0;margin-bottom:14px;font:inherit;font-size:20px;font-weight:700;background:var(--panel);border:1px solid var(--frame);border-radius:14px;color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .big:active{background:#eeece7}
  .back{font-size:15px;color:var(--sub);text-decoration:none;padding:10px}
  button.back{background:none;border:0;font:inherit;font-size:15px;cursor:pointer}
  .stage{font-size:15px;color:var(--sub);margin:0 0 18px}
  .stage b{color:var(--ink);font-size:17px;margin-right:10px}
  #cards{display:flex;flex-direction:column}
  /* やめるは最後の札から離す＝札を狙った指が当たらない（やめると3rdの前でも取り消せない） */
  #giveup{margin-top:18px}
  .big:disabled{order:1;padding:8px 0;margin-bottom:4px;font-size:14px;font-weight:400;color:var(--sub);background:transparent;border-color:transparent;cursor:default}
  .big small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:4px}
  .num{font-size:min(56px,12vw);font-weight:700;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .num small{font-size:18px;color:var(--sub);font-weight:400;margin-left:4px}
  .label{font-size:13px;color:var(--sub);margin:22px 0 2px}
  .line{font-size:15px;color:var(--sub);margin:8px 0}
  #charRare small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
  .up{color:var(--ink);font-weight:700}
  #charEmoji{font-size:40px;margin:0 0 8px}
  #charName{font-size:22px;font-weight:700;margin:0 0 6px}
  #charRare{font-size:17px;font-weight:700;min-height:1.5em;margin:0 0 24px}
  /* プレイ中は上に細い帯（左=やめる・右=持ち点）を取り、ゲームはその下から始める＝ゲーム側の見出し・手数と重ならない */
  :root{--bar:calc(36px + env(safe-area-inset-top))}
  #play{position:fixed;left:0;top:var(--bar);width:100%;height:calc(100% - var(--bar));border:0;border-top:1px solid var(--frame);background:var(--bg)}
  #play[hidden],#quit[hidden],#hud[hidden]{display:none}
  #hud{position:fixed;right:14px;top:env(safe-area-inset-top);height:36px;line-height:36px;z-index:5;pointer-events:none;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  #hud.down{color:#d94436}
  #quit{position:fixed;left:4px;top:env(safe-area-inset-top);height:36px;z-index:5;font:inherit;font-size:14px;padding:0 10px;color:var(--sub);background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .time{font-size:13px}
  /* 自分の記録：1件1行（左=系統の絵文字と✨・右=点）。点は右揃えで桁の多さが並びで見える */
  #recordList{list-style:none;margin:0 0 24px;padding:0;text-align:left}
  #recordList li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 4px;border-bottom:1px solid var(--frame);font-size:20px}
  #recordList b{font-variant-numeric:tabular-nums;white-space:nowrap}
  #recordList small{font-size:13px;font-weight:400;color:var(--sub);margin-left:2px}
</style>
</head>
<body>
<section class="screen" id="title">
  <h1>クエスト</h1>
  <button type="button" class="big" id="start">はじめる</button>
  <!-- 記録が1件もないうちは出さない（空の画面へ案内しない） -->
  <button type="button" class="back" id="toRecords" hidden>きろく</button>
  <a class="back" href="../">‹ パズル箱</a>
</section>

<section class="screen" id="records" hidden>
  <ol id="recordList"></ol>
  <button type="button" class="back" id="recordsBack">‹ タイトルへ</button>
</section>

<section class="screen" id="choose" hidden>
  <div class="stage" id="chooseStage"></div>
  <div id="cards"></div>
  <button type="button" class="back" id="giveup">やめる</button>
</section>

<iframe id="play" title="パズル" hidden></iframe>
<button type="button" id="quit" hidden>やめる</button>
<div id="hud" hidden></div>

<section class="screen" id="stageEnd" hidden>
  <div class="stage" id="endStage"></div>
  <div class="line" id="endScore" style="font-size:20px;color:var(--ink);font-weight:700;margin:0"></div>
  <div class="line" id="endDetail" style="margin-top:4px"></div>
  <div class="label">累計</div>
  <div class="num" id="endTotal"></div>
  <div class="line" id="endDigits"></div>
  <div class="line time" id="endTime" style="margin-bottom:30px"></div>
  <button type="button" class="big" id="onward"></button>
</section>

<section class="screen" id="final" hidden>
  <div id="charEmoji"></div>
  <div id="charName"></div>
  <div id="charRare"></div>
  <div class="num" id="finalScore"></div>
  <div class="line" id="finalDigits"></div>
  <div class="line" id="finalBoss"></div>
  <div class="line time" id="finalTime" style="margin-bottom:30px"></div>
  <button type="button" class="big" id="again">もう一度</button>
  <button type="button" class="back" id="toTitle">‹ タイトルへ</button>
</section>

<section class="screen" id="out" hidden>
  <div id="outHead" style="font-size:22px;font-weight:700;margin:0 0 6px">アウト</div>
  <div class="label">累計</div>
  <div class="num" id="outScore"></div>
  <div class="line" id="outDigits"></div>
  <div class="line time" id="outTime" style="margin-bottom:30px"></div>
  <button type="button" class="big" id="outAgain">もう一度</button>
  <button type="button" class="back" id="outTitle">‹ タイトルへ</button>
</section>

<script>
/* 系統とゲーム（spec §2）。キャラ名の部品は spec §5（1st=種族・2nd=気質・3rd=称号） */
var SYSTEMS = [
  { id: 'move', emoji: '🚗', label: '動かす', parts: ['歯車族', 'せっかちな', '走り屋'],
    games: ['car-escape', 'hakoiri-musume', 'slide-robots'] },
  { id: 'fill', emoji: '🧩', label: '埋める', parts: ['石板族', '几帳面な', '職人'],
    games: ['sudoku', 'hoshi-oki', 'pixel'] },
  { id: 'link', emoji: '🔗', label: 'つなぐ', parts: ['糸族', '人懐っこい', '案内人'],
    games: ['michi-tsunagi', 'kurukuru', 'mado-wake'] }
];
var NAMES = {
  'car-escape': '車をだせ！', 'hakoiri-musume': '箱入り娘', 'slide-robots': 'すべりロボ',
  'sudoku': '数独', 'hoshi-oki': '星おき', 'pixel': 'ピクセル',
  'michi-tsunagi': 'みちつなぎ', 'kurukuru': 'くるくる', 'mado-wake': '窓わけ'
};
/* クエスト対応済みのゲーム（?quest=<添字> と quest-solved 通知を実装済み）。ここに1行足せば出るようになる（足す側のゲームでは ?quest のとき「‹ パズル箱」も隠す）。
   値は各段の問題番号（LEVELSの添字）の範囲 [最初, 最後]（両端含む）。spec §7
   車をだせ！: 入門0-9・初級10-19・中級20-29・上級30-39・達人40-49 → 易=入門+初級／中=中級／難=上級+達人
   ピクセル: 入門0-9・初級10-19・中級20-29・上級30-39・特級40-44・達人45-49・名画50-59 → 易=入門+初級／中=中級+上級／難=特級+達人+名画
   他7本: 入門0-9・初級10-19・中級20-29・上級30-39 → 易=入門／中=初級+中級／難=上級 */
var QUEST = {
  'car-escape':     { easy: [0, 19], mid: [20, 29], hard: [30, 49] },
  'hakoiri-musume': { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'slide-robots':   { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'sudoku':         { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'hoshi-oki':      { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'pixel':          { easy: [0, 19], mid: [20, 39], hard: [40, 59] },
  'michi-tsunagi':  { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'kurukuru':       { easy: [0, 9],  mid: [10, 29], hard: [30, 39] },
  'mado-wake':      { easy: [0, 9],  mid: [10, 29], hard: [30, 39] }
};
/* ステージごとの段と点の上限（spec §3・§4 案②） */
var STAGES = [
  { name: '1st', tier: 'easy', tierName: '易', cap: 100 },
  { name: '2nd', tier: 'mid',  tierName: '中', cap: 1000 },
  { name: '3rd', tier: 'hard', tierName: '難', cap: 10000 }
];
/* 持ち点が尽きるまでの余裕（spec §4 2026-09-27）。時間は採点にもアウトにも使わない。
   余分に打てる手数 = max(最短×SLACK, FLOOR)。倍率だけだと最短が小さいゲーム（すべりロボ入門は
   最短3手）で +6手しか許されず厳しすぎるので、どのゲームでも最低 FLOOR 手は許す。数値は叩き台 */
var SLACK = 2;
var FLOOR = 10;
/* キリ番（spec §6）。下3桁777 は別判定 */
var KIRIBAN = [777777, 77777777, 123456, 1234567, 1000000000];
/* 幕間とボス（spec §9 2版目）。添字＝そのステージを解いた後。早撃ちは勝てば×2、負けても減らない */
var BOUTS = [
  /* コンピュータが取るまでの時間。1.2秒／0.8秒では実機で勝てなかった（2026-10-01）。叩き台 */
  { type: 'quest-duel', name: '早撃ち', src: 'hayauchi.html?cpu=2000' },
  { type: 'quest-duel', name: '早撃ち', src: 'hayauchi.html?cpu=1500' },
  { type: 'quest-boss', name: 'ボス',   src: 'boss.html' }
];
var DUEL_RATE = 2;
/* ボスの倍率 = min(MAX, max(MIN, TOP − 手数))：3手で×10、11手以上は×2。負け・降参は×1。数値は叩き台
   ボス先手での実測（2026-10-01・各2000局）：3手読みの勝ちの7%が3手（×10）、初心者役の勝ちは×2〜×10に散る。出ない倍率は無い */
var BOSS_TOP = 13, BOSS_MAX = 10, BOSS_MIN = 2;

var $ = function (id) { return document.getElementById(id); };
var SCREENS = ['title', 'choose', 'play', 'stageEnd', 'final', 'out', 'records'];
var run = null;      /* 1プレイの状態 */
var current = null;  /* いま解いている問題 */

function show(id) {
  SCREENS.forEach(function (k) { $(k).hidden = k !== id; });
  $('quit').hidden = id !== 'play';
  $('hud').hidden = id !== 'play';
  window.scrollTo(0, 0);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { return n.toLocaleString('ja-JP'); }
function digits(n) { return String(n).length; }
function mmss(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }

function start() {
  run = { stage: 0, total: 1, used: {}, systems: [], exact: false, time: 0, bouts: 0, bout: null, boss: 0 };
  choose();
}

/* 各系統から、このプレイでまだ遊んでいない対応済みゲームを1本ずつ候補にする（出たが選ばなかったものは再登場してよい） */
function choose() {
  var st = STAGES[run.stage];
  $('chooseStage').innerHTML = '<b>' + st.name + '・' + st.tierName + '</b>最高 ' + fmt(st.cap) + '点';
  var box = $('cards');
  box.innerHTML = '';
  SYSTEMS.forEach(function (sys, si) {
    var pool = sys.games.filter(function (g) { return QUEST[g] && !run.used[g]; });
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'big';
    if (!pool.length) {
      b.disabled = true;
      b.textContent = sys.emoji + ' ' + sys.label + '　準備中';
    } else {
      var g = pick(pool);
      b.innerHTML = sys.emoji + ' ' + NAMES[g] + '<small>' + sys.label + '</small>';
      b.addEventListener('click', function () { play(si, g); });
    }
    box.appendChild(b);
  });
  show('choose');
}

function play(si, g) {
  var st = STAGES[run.stage], r = QUEST[g][st.tier];
  var level = r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1));
  run.used[g] = 1;
  /* t0 は問題が表示された時点（iframe の load）から。moves=0 の間は手数減点なし */
  current = { sys: si, game: g, level: level, cap: st.cap,
              t0: null, tPlay: Date.now(), moves: 0, min: 0 };
  $('play').src = '../' + g + '/?quest=' + level;
  show('play');
  hud();
}

/* 残り具合：最短までは1、そこから直線的に減り、最短×(1+SLACK) 手で0＝アウト（spec §4）。
   考える時間は罰しない。手を動かしすぎたときだけ落ちる。手数が未確定（0）なら減らさない */
function left(moves, min) {
  if (!(moves > 0 && min > 0) || moves <= min) return 1;
  return Math.max(0, 1 - (moves - min) / Math.max(min * SLACK, FLOOR));
}
function points(cap, moves, min) { return Math.round(cap * left(moves, min)); }
function elapsed() { return current.t0 === null ? 0 : Date.now() - current.t0; }

function hud() {
  if (!current) return;
  $('hud').textContent = fmt(Math.max(1, points(current.cap, current.moves, current.min))) + '点';
  /* 表示だけ：最短を超えて減り始めたら赤 */
  $('hud').classList.toggle('down', current.min > 0 && current.moves > current.min);
}

/* 持ち点が0になったら即アウト（spec §4）：そこまでの累計・桁数・累計タイムを見せる。キャラなし。
   ギブアップも同じ画面で終える（見出しだけ変える） */
function out(gaveUp) {
  current = null;
  $('play').removeAttribute('src');
  $('outHead').textContent = gaveUp ? 'ギブアップ' : 'アウト';
  recordRun(gaveUp ? 'giveup' : 'out');
  var cleared = run.stage > 0;
  $('outScore').innerHTML = (cleared ? fmt(run.total) : '0') + '<small>点</small>';
  $('outDigits').textContent = cleared ? digits(run.total) + '桁' + best() : '';
  $('outTime').textContent = cleared ? 'タイム ' + mmss(run.time) : '';
  run = null;
  show('out');
}

/* 自分の記録（spec §11 2026-09-30）。この端末の中だけに残し、どこにも送らない。
   1ステージでもクリアしたプレイだけを、点の高い順に上位 RECORD_MAX 件。同点はタイムの速い方が上 */
var RECORD_KEY = 'quest-records';
var RECORD_MAX = 10;
var lastRank = 0;   /* 直前のプレイが記録の何位に入ったか（圏外・未保存は0）。終わりの画面で使う */
function validRecord(r) {
  /* 満点は 100×1,000×10,000×2×2×10＝400億。それを超える点は書き換えられたデータ */
  return !!r && Number.isInteger(r.score) && r.score > 0 && r.score <= 40000000000
    && Number.isInteger(r.stages) && r.stages >= 1 && r.stages <= 3
    && Number.isInteger(r.time) && r.time >= 0 && Number.isFinite(r.at)
    && (r.end === 'clear' || r.end === 'out' || r.end === 'giveup')
    && typeof r.emoji === 'string' && typeof r.name === 'string' && typeof r.rare === 'boolean';
}
function loadRecords() {
  try {
    var a = JSON.parse(localStorage.getItem(RECORD_KEY) || '[]');
    return Array.isArray(a) ? a.filter(validRecord) : [];
  } catch (e) { return []; }
}
/* 記録を足し、何位に入ったかを返す（圏外なら0） */
function addRecord(r) {
  var a = loadRecords();
  a.push(r);
  a.sort(function (x, y) { return y.score - x.score || x.time - y.time || x.at - y.at; });
  a = a.slice(0, RECORD_MAX);
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(a)); } catch (e) { return 0; }
  return a.indexOf(r) + 1;
}
/* 1プレイの終わりに記録を作る。キャラ名は完走したときだけ */
function recordRun(end, name, rare) {
  lastRank = 0;
  if (run.stage < 1 && end !== 'clear') return;   /* 1つもクリアしていないプレイは残さない */
  lastRank = addRecord({
    score: run.total, stages: end === 'clear' ? 3 : run.stage, end: end, time: Math.round(run.time), at: Date.now(),
    emoji: run.systems.map(function (i) { return SYSTEMS[i].emoji; }).join(''), name: name || '', rare: !!rare
  });
}

/* 終わりの画面では1位に入ったときだけ「自己ベスト」と添える（2位以下の順位は出さない）。
   記録がこの1件だけのとき（初回）は毎回1位になるので言わない */
function best() {
  return lastRank === 1 && loadRecords().length > 1 ? '・自己ベスト' : '';
}

/* 記録の一覧。並び順が順位なので順位の数字は出さない。キャラ名は絵文字の並びから決まるので重ねて出さない。
   保存データは書き換えられうるので textContent で入れる */
function records() {
  var box = $('recordList');
  box.textContent = '';
  loadRecords().forEach(function (r) {
    var li = document.createElement('li');
    var face = document.createElement('span');
    face.textContent = r.emoji + (r.rare ? '✨' : '');
    var sc = document.createElement('b');
    sc.textContent = fmt(r.score);
    var unit = document.createElement('small');
    unit.textContent = '点';
    sc.appendChild(unit);
    li.appendChild(face);
    li.appendChild(sc);
    box.appendChild(li);
  });
  show('records');
}
function title() {
  $('toRecords').hidden = !loadRecords().length;
  show('title');
}

function isKiriban(n) { return n % 1000 === 777 || KIRIBAN.indexOf(n) >= 0; }

function solved(d) {
  var st = STAGES[run.stage];
  var t = elapsed();
  if (left(d.moves, d.min) <= 0) { out(); return; }
  var s = Math.max(1, points(current.cap, d.moves, d.min));
  run.time += t;
  var before = run.stage === 0 ? 0 : digits(run.total);
  run.total *= s;
  run.systems.push(current.sys);
  if (d.moves === d.min) run.exact = true;
  current = null;
  var after = digits(run.total);
  $('endStage').textContent = st.name + '・' + st.tierName;
  $('endScore').textContent = (before ? '× ' : '') + fmt(s) + '点';
  $('endDetail').textContent = '手数 ' + d.moves + ' ／ 最短 ' + d.min + (d.moves === d.min ? ' ★' : '');
  $('endTotal').innerHTML = fmt(run.total) + '<small>点</small>';
  $('endDigits').innerHTML = before
    ? before + '桁 → <span class="up">' + after + '桁</span>' + (after > before ? ' ↑' : '')
    : '<span class="up">' + after + '桁</span>';
  $('endTime').textContent = 'タイム ' + mmss(t) + (before ? ' ／ 累計 ' + mmss(run.time) : '');
  /* つぎが幕間・ボスなら、ボタンをその名前にして、押す前に何が賭かるかを小さく1行（札と同じ形） */
  var nb = BOUTS[run.stage];
  $('onward').textContent = nb ? nb.name : run.stage < STAGES.length - 1 ? 'つぎへ' : 'けっか';
  if (nb) {
    var hint = document.createElement('small');
    hint.textContent = (nb.type === 'quest-boss' ? '勝てば最大×' + BOSS_MAX : '勝てば×' + DUEL_RATE) + '・負けても減らない';
    $('onward').appendChild(hint);
  }
  setTimeout(function () { show('stageEnd'); $('play').removeAttribute('src'); }, 700);
}

/* 幕間の早撃ち・ボス（spec §9）。持ち点の帯と「やめる」は出さない（早撃ちは一瞬・ボスには降参がある） */
function bout() {
  run.bout = BOUTS[run.stage].type;
  $('play').src = BOUTS[run.stage].src;
  show('play');
  $('quit').hidden = $('hud').hidden = true;
}
function bossRate(moves) {
  if (!(moves > 0)) return BOSS_MIN;   /* 手数が届かなければ一番低い倍率 */
  return Math.min(BOSS_MAX, Math.max(BOSS_MIN, BOSS_TOP - moves));
}
/* 決着：勝てば累計に倍率を掛ける。結果はステージの終わりと同じ画面で見せる */
function boutEnd(d) {
  var b = BOUTS[run.stage], win = d.win === true;
  var rate = !win ? 1 : b.type === 'quest-boss' ? bossRate(d.moves) : DUEL_RATE;
  var before = digits(run.total);
  run.bout = null;
  run.bouts++;
  run.total *= rate;
  if (b.type === 'quest-boss') run.boss = win ? rate : 0;
  var after = digits(run.total);
  $('endStage').textContent = b.name;
  $('endScore').textContent = win ? '勝ち ×' + rate : '負け';
  $('endDetail').textContent = win && b.type === 'quest-boss' ? d.moves + '手' : '';
  $('endTotal').innerHTML = fmt(run.total) + '<small>点</small>';
  $('endDigits').innerHTML = win
    ? before + '桁 → <span class="up">' + after + '桁</span>' + (after > before ? ' ↑' : '')
    : after + '桁';
  $('endTime').textContent = '';
  $('onward').textContent = run.stage < STAGES.length - 1 ? 'つぎへ' : 'けっか';
  setTimeout(function () { show('stageEnd'); $('play').removeAttribute('src'); }, 700);
}

function onward() {
  if (BOUTS[run.stage] && run.bouts <= run.stage) { bout(); return; }   /* このステージの後の幕間・ボスがまだ */
  run.stage++;
  if (run.stage < STAGES.length) { choose(); return; }
  var sy = run.systems.map(function (i) { return SYSTEMS[i]; });
  var rare = run.exact || isKiriban(run.total);
  $('charEmoji').textContent = sy.map(function (x) { return x.emoji; }).join('');
  var name = sy[1].parts[1] + sy[0].parts[0] + 'の' + sy[2].parts[2];
  $('charName').textContent = name;
  recordRun('clear', name, rare);
  var why = [];
  if (run.exact) why.push('最短で解いた');
  if (isKiriban(run.total)) why.push('キリ番');
  $('charRare').innerHTML = rare ? '✨レア版<small>' + why.join('・') + '</small>' : '';
  $('finalScore').innerHTML = fmt(run.total) + '<small>点</small>';
  $('finalDigits').textContent = digits(run.total) + '桁' + best();
  $('finalBoss').textContent = run.boss ? 'ボス 勝ち ×' + run.boss : 'ボス 負け';
  $('finalTime').textContent = 'タイム ' + mmss(run.time);
  run = null;
  show('final');
}

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!run || !current || e.source !== $('play').contentWindow) return;
  if (!d || (d.type !== 'quest-solved' && d.type !== 'quest-moves') || d.game !== current.game || d.level !== current.level) return;
  if (!(d.moves > 0 && d.min > 0)) return;
  if (current.t0 === null) current.t0 = current.tPlay;  /* load を取り逃した保険 */
  if (d.type === 'quest-moves') {
    current.moves = d.moves; current.min = d.min;
    if (left(d.moves, d.min) <= 0) { out(); return; }   /* 手を動かしすぎた＝その場でアウト */
    hud(); return;
  }
  solved(d);
});

/* 幕間・ボスの決着（{type, win[, moves]}）。今その段階にいるときだけ、1回だけ受ける */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!run || !run.bout || e.source !== $('play').contentWindow) return;
  if (!d || d.type !== run.bout) return;
  boutEnd(d);
});

/* 問題が表示されたら計測開始 */
$('play').addEventListener('load', function () {
  if (current && current.t0 === null && $('play').getAttribute('src')) current.t0 = Date.now();
});

/* ギブアップ（spec §1 2026-09-27）：そこまでにクリアしたステージの累計で終える。キャラなし。
   解いている途中のステージの持ち点は数えない。数えると、解くよりやめる方が得な場面が出るため */
function giveUp() { out(true); }

$('start').addEventListener('click', start);
$('again').addEventListener('click', start);
$('onward').addEventListener('click', onward);
$('quit').addEventListener('click', giveUp);
$('giveup').addEventListener('click', giveUp);
$('toTitle').addEventListener('click', title);
$('outAgain').addEventListener('click', start);
$('outTitle').addEventListener('click', title);
$('toRecords').addEventListener('click', records);
$('recordsBack').addEventListener('click', title);
$('toRecords').hidden = !loadRecords().length;
</script>
</body>
</html>
