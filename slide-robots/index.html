<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>すべりロボ</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#e6e4de; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --wall:#4a463f; --block:#8f8a80;
    --R:#d24234; --B:#3f6fb0; --Y:#d3a017; --G:#4c8d55;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:420px;margin:0 auto;padding:10px 10px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 2px 10px}
  #title{font-size:20px;font-weight:700;letter-spacing:.02em}
  #callOut{font-size:15px;color:var(--sub);white-space:nowrap}
  #callOut b{color:var(--ink);font-weight:700;font-size:17px}

  #stage{position:relative}
  #board{
    /* content-box にして枠線を外へ出す＝マスが正方形になる */
    box-sizing:content-box;position:relative;
    width:calc(100% - 6px);max-width:400px;aspect-ratio:1/1;margin:0 auto;
    background:var(--panel);border:3px solid var(--sub);border-radius:8px;
    background-image:
      repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px calc(100% / 12)),
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(100% / 12));
    overflow:hidden;touch-action:none;
  }
  .wallH,.wallV{position:absolute;background:var(--wall);border-radius:2px;z-index:3}
  .wallH{height:3px}
  .wallV{width:3px}
  #block{position:absolute;background:var(--block);border-radius:6px;z-index:2}

  .target{
    position:absolute;z-index:1;border:3px solid currentColor;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;opacity:.55;
  }
  .target.Y{opacity:.85} /* 黄は明るく溶けるので濃く */
  .robot{
    position:absolute;z-index:5;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;color:#fff;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.2);
    touch-action:none;cursor:grab;opacity:.4;pointer-events:none;
    transition:left .15s ease, top .15s ease, transform .12s ease;
  }
  #board.live .robot{opacity:1;pointer-events:auto}
  .robot.dragging{z-index:7;transform:scale(1.12);cursor:grabbing}
  .robot.R{background:var(--R)} .robot.B{background:var(--B)}
  .robot.Y{background:var(--Y);color:#2b2b2b} .robot.G{background:var(--G)}
  .target.R{color:var(--R)} .target.B{color:var(--B)}
  .target.Y{color:var(--Y)} .target.G{color:var(--G)}
  #ghost{
    position:absolute;z-index:4;border-radius:50%;border:2px dashed currentColor;
    opacity:.6;pointer-events:none;
  }
  #ghost[hidden]{display:none}

  #call{padding:12px 0 2px}
  #callAsk{font-size:15px;color:var(--sub);padding:0 2px 6px}
  #callGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  #callGrid button{padding:0;height:42px;font-size:16px}
  #call[hidden]{display:none}

  #buttons{display:flex;gap:8px;padding:12px 0 4px}
  button{
    font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--frame);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{background:#eeece7}
  button:disabled{opacity:.4;cursor:default}
  #buttons button{flex:1}

  #clear{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
    background:rgba(245,244,241,.94);border-radius:10px;z-index:20;
  }
  #clear[hidden]{display:none}
  #clearTitle{font-size:26px;font-weight:700}
  #clearVerdict{font-size:16px;min-height:1.5em}
  #clearStats{font-size:15px;color:var(--sub)}
  #clearStats b{color:var(--ink);font-weight:700}
  #next{font-size:17px;padding:12px 28px;margin-top:6px}

  #levels{padding-top:18px}
  .tier{margin-bottom:10px}
  .tierName{font-size:13px;color:var(--sub);padding:2px 2px 4px}
  .tierRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .lv{
    padding:0;height:40px;font-size:14px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
  }
  .lv.cur{border-color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title">すべりロボ</div>
    <div id="callOut"></div>
  </header>

  <div id="stage">
    <div id="board"></div>
    <div id="clear" hidden>
      <div id="clearTitle">クリア！</div>
      <div id="clearVerdict"></div>
      <div id="clearStats"></div>
      <button id="next">つぎへ</button>
    </div>
  </div>

  <section id="call">
    <div id="callAsk">何手で行ける？</div>
    <div id="callGrid"></div>
  </section>

  <div id="buttons">
    <button id="undo">もどす</button>
    <button id="reset">はじめから</button>
  </div>

  <section id="levels"></section>
</div>

var SlideRobots = (function () {
  var W = 12;                     // 盤の幅（＝高さ）
  var DIRS = ['N', 'E', 'S', 'W'];
  var BIT = [1, 2, 4, 8];         // N=1, E=2, S=4, W=8
  var DX = [0, 1, 0, -1];
  var DY = [-1, 0, 1, 0];

  function dirIndex(d) {
    if (typeof d === 'number') return (d >= 0 && d <= 3) ? (d | 0) : -1;
    var i = DIRS.indexOf(String(d).toUpperCase());
    return i;
  }
  function cellOf(x, y) { return y * W + x; }
  function xy(cell) { return { x: cell % W, y: Math.floor(cell / W) }; }

  /* レベル1件 -> state。state は使い回さず、applyMove は新しい state を返す */
  function parse(level) {
    var walls = [], i;
    for (i = 0; i < W * W; i++) {
      var v = parseInt(level.walls.charAt(i), 16);
      walls.push(isNaN(v) ? 0 : v);
    }
    var robots = [], colors = [];
    for (i = 0; i < level.robots.length; i++) {
      robots.push(cellOf(level.robots[i][0], level.robots[i][1]));
      colors.push(level.robots[i][2]);
    }
    var t = level.target;
    return {
      w: W, walls: walls, robots: robots, colors: colors,
      target: cellOf(t[0], t[1]), targetColor: t[2],
      targetIdx: colors.indexOf(t[2]),
      min: level.min | 0
    };
  }

  function cloneState(s) {
    return {
      w: s.w, walls: s.walls, robots: s.robots.slice(), colors: s.colors,
      target: s.target, targetColor: s.targetColor, targetIdx: s.targetIdx, min: s.min
    };
  }

  /* robotIdx の体を dir へ「壁か他の体に当たるまで」滑らせた先のマス。
     1マスも動けない（＝手にならない）なら null */
  function slide(state, robotIdx, dir) {
    var d = dirIndex(dir);
    if (d < 0 || !state || !state.robots) return null;
    var pos = state.robots[robotIdx];
    if (typeof pos !== 'number' || pos < 0 || pos >= W * W) return null; /* 盤外は動かさない（無限ループ防止） */
    var walls = state.walls, robots = state.robots;
    var cur = pos, step = DY[d] * W + DX[d], k, nx, hit;
    for (;;) {
      if (walls[cur] & BIT[d]) break;
      nx = cur + step;
      hit = false;
      for (k = 0; k < robots.length; k++) if (robots[k] === nx) { hit = true; break; }
      if (hit) break;
      cur = nx;
    }
    return cur === pos ? null : cur;
  }

  /* 動かした新しい state。動けなければ null（元の state は変えない） */
  function applyMove(state, robotIdx, dir) {
    var to = slide(state, robotIdx, dir);
    if (to === null) return null;
    var ns = cloneState(state);
    ns.robots[robotIdx] = to;
    return ns;
  }

  function isSolved(state) {
    if (!state || !state.robots) return false;
    return state.robots[state.targetIdx] === state.target;
  }

  /* 最短手数を幅優先で求める。解けなければ -1。
     状態＝4体の位置（的の色の体は区別し、他は順不同に正規化）
     opts.path を真にすると {min, path:[[マス, 向き], ...]} を返す */
  function solve(level, opts) {
    opts = opts || {};
    var state = (level && typeof level.walls === 'string') ? parse(level) : level;
    var cap = opts.depthCap || 12;
    var goal = state.target;
    var tIdx = state.targetIdx;
    var start = [state.robots[tIdx]];
    var k;
    for (k = 0; k < state.robots.length; k++) if (k !== tIdx) start.push(state.robots[k]);
    if (start[0] === goal) return opts.path ? { min: 0, path: [] } : 0;
    var walls = state.walls;

    function key(a) { return ((a[0] * 144 + a[1]) * 144 + a[2]) * 144 + a[3]; }
    function norm(a) {
      var o = [a[1], a[2], a[3]];
      o.sort(function (p, q) { return p - q; });
      return [a[0], o[0], o[1], o[2]];
    }
    function slideRaw(st, i) {
      /* st の i 番目を各方向へ滑らせた先（動けない向きは -1） */
      var out = [-1, -1, -1, -1], pos = st[i], d, cur, step, nx, j, hit;
      for (d = 0; d < 4; d++) {
        cur = pos; step = DY[d] * W + DX[d];
        for (;;) {
          if (walls[cur] & BIT[d]) break;
          nx = cur + step;
          hit = false;
          for (j = 0; j < 4; j++) if (st[j] === nx) { hit = true; break; }
          if (hit) break;
          cur = nx;
        }
        if (cur !== pos) out[d] = cur;
      }
      return out;
    }

    var s0 = norm(start);
    var seen = new Map();
    var nodes = [];      // path 用: {st, prev, cell, dir}
    seen.set(key(s0), 0);
    nodes.push({ st: s0, prev: -1, cell: -1, dir: -1 });
    var frontier = [0], depth = 0;

    function unwind(ni, cell, dir) {
      var out = [[cell, DIRS[dir]]];
      while (ni > 0) { out.unshift([nodes[ni].cell, DIRS[nodes[ni].dir]]); ni = nodes[ni].prev; }
      return out;
    }

    while (frontier.length && depth < cap) {
      depth++;
      var next = [];
      for (var f = 0; f < frontier.length; f++) {
        var ni = frontier[f], st = nodes[ni].st;
        for (var i = 0; i < 4; i++) {
          var dest = slideRaw(st, i);
          for (var d = 0; d < 4; d++) {
            if (dest[d] < 0) continue;
            if (i === 0 && dest[d] === goal) {
              return opts.path ? { min: depth, path: unwind(ni, st[0], d) } : depth;
            }
            var ns = st.slice();
            ns[i] = dest[d];
            ns = norm(ns);
            var kk = key(ns);
            if (seen.has(kk)) continue;
            seen.set(kk, 1);
            nodes.push({ st: ns, prev: ni, cell: st[i], dir: d });
            next.push(nodes.length - 1);
          }
        }
      }
      frontier = next;
    }
    return opts.path ? { min: -1, path: null } : -1;
  }

  return {
    W: W, DIRS: DIRS, LEVELS: LEVELS,
    cellOf: cellOf, xy: xy, dirIndex: dirIndex,
    parse: parse, cloneState: cloneState,
    slide: slide, applyMove: applyMove, isSolved: isSolved, solve: solve
  };
})();

if (typeof window !== 'undefined') window.SlideRobots = SlideRobots;
if (typeof globalThis !== 'undefined') globalThis.SlideRobots = SlideRobots;

/* =====================================================================
   画面
   ===================================================================== */
if (typeof document !== 'undefined') (function () {
  var W = SlideRobots.W;
  var KEY = 'slide-robots';
  var SYMBOL = { R: '●', B: '▲', Y: '■', G: '◆' };  /* ● ▲ ■ ◆ */
  var GAP = 2;
  var AXIS_LOCK = 6;      /* これだけ指が動いたら向きを決める（px） */

  var elBoard = document.getElementById('board');
  var elCall = document.getElementById('call');
  var elCallGrid = document.getElementById('callGrid');
  var elCallOut = document.getElementById('callOut');
  var elTitle = document.getElementById('title');
  var elClear = document.getElementById('clear');
  var elClearTitle = document.getElementById('clearTitle');
  var elClearVerdict = document.getElementById('clearVerdict');
  var elClearStats = document.getElementById('clearStats');
  var elNext = document.getElementById('next');
  var elUndo = document.getElementById('undo');
  var elReset = document.getElementById('reset');
  var elLevels = document.getElementById('levels');

  /* 段階名と何本目か（クリアするまで見せない） */
  var LABELS = (function () {
    var out = [], count = {}, i, t;
    for (i = 0; i < LEVELS.length; i++) {
      t = LEVELS[i].tier;
      count[t] = (count[t] || 0) + 1;
      out.push({ tier: t, no: count[t], text: t + ' ' + count[t] });
    }
    return out;
  })();

  var save = { cleared: {}, last: 0 };
  function loadSave() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        if (o.cleared && typeof o.cleared === 'object') save.cleared = o.cleared;
        if (Number.isInteger(o.last) && o.last >= 0 && o.last < LEVELS.length) save.last = o.last;
      }
    } catch (e) { /* 保存が使えなくても遊べる */ }
  }
  function storeSave() {
    try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
  }

  var levelIndex = 0;
  var state = null;
  var moves = 0;
  var call = 0;           /* 宣言した手数。0 = まだ宣言していない */
  var history = [];
  var finished = false;
  var els = [];           /* ロボットの div */
  var elGhost = null;

  function pc(v) { return (v * 100 / W) + '%'; }
  function setBox(d, x, y, w, h) {
    d.style.left = 'calc(' + pc(x) + ' + ' + GAP + 'px)';
    d.style.top = 'calc(' + pc(y) + ' + ' + GAP + 'px)';
    d.style.width = 'calc(' + pc(w) + ' - ' + (GAP * 2) + 'px)';
    d.style.height = 'calc(' + pc(h) + ' - ' + (GAP * 2) + 'px)';
  }
  function cellSize() { return elBoard.clientWidth / W; }   /* 枠線を含めない */

  function place(animIdx, dist) {
    for (var i = 0; i < state.robots.length; i++) {
      var p = SlideRobots.xy(state.robots[i]);
      var d = els[i];
      if (animIdx === i && dist) {
        d.style.transitionDuration = Math.min(.25, .09 + dist * .02) + 's';
      } else {
        d.style.transitionDuration = '';
      }
      d.style.left = 'calc(' + pc(p.x) + ' + ' + GAP + 'px)';
      d.style.top = 'calc(' + pc(p.y) + ' + ' + GAP + 'px)';
    }
  }

  function buildBoard() {
    elBoard.innerHTML = '';
    els = [];
    var i, x, y, d;

    /* 中央の塊 */
    var blk = document.createElement('div');
    blk.id = 'block';
    blk.style.left = pc(W / 2 - 1); blk.style.top = pc(W / 2 - 1);
    blk.style.width = pc(2); blk.style.height = pc(2);
    elBoard.appendChild(blk);

    /* 壁（マスの辺に太い線）。内側の辺だけ描く（外周は盤の枠線） */
    for (i = 0; i < W * W; i++) {
      x = i % W; y = Math.floor(i / W);
      if ((state.walls[i] & 1) && y > 0) {                 /* 北 */
        d = document.createElement('div');
        d.className = 'wallH';
        d.style.left = pc(x); d.style.width = pc(1);
        d.style.top = 'calc(' + pc(y) + ' - 1.5px)';
        elBoard.appendChild(d);
      }
      if ((state.walls[i] & 8) && x > 0) {                 /* 西 */
        d = document.createElement('div');
        d.className = 'wallV';
        d.style.top = pc(y); d.style.height = pc(1);
        d.style.left = 'calc(' + pc(x) + ' - 1.5px)';
        elBoard.appendChild(d);
      }
    }

    /* 的 */
    var tp = SlideRobots.xy(state.target);
    var tgt = document.createElement('div');
    tgt.className = 'target ' + state.targetColor;
    tgt.textContent = SYMBOL[state.targetColor];
    setBox(tgt, tp.x, tp.y, 1, 1);
    elBoard.appendChild(tgt);

    /* 止まる先の目印 */
    elGhost = document.createElement('div');
    elGhost.id = 'ghost';
    elGhost.hidden = true;
    elBoard.appendChild(elGhost);

    /* ロボット */
    for (i = 0; i < state.robots.length; i++) {
      var c = state.colors[i];
      var r = document.createElement('div');
      r.className = 'robot ' + c;
      r.textContent = SYMBOL[c];
      r.dataset.id = String(i);
      setBox(r, 0, 0, 1, 1);
      elBoard.appendChild(r);
      els.push(r);
      r.addEventListener('pointerdown', onDown);
      r.addEventListener('pointermove', onMove);
      r.addEventListener('pointerup', onUp);
      r.addEventListener('pointercancel', onUp);
    }
    place();
  }

  function loadLevel(i) {
    levelIndex = i;
    state = SlideRobots.parse(LEVELS[i]);
    moves = 0;
    call = 0;
    history = [];
    finished = false;
    drag = null;
    elClear.hidden = true;
    elCall.hidden = false;
    elTitle.textContent = LABELS[i].text;
    elCallOut.textContent = '';
    elBoard.classList.remove('live');
    elUndo.disabled = true;
    buildBoard();
    renderLevelList();
    save.last = i;
    storeSave();
  }

  /* ---- 宣言（選ぶまでロボットは動かない） ---- */
  (function buildCallGrid() {
    for (var n = 1; n <= 12; n++) {
      var b = document.createElement('button');
      b.textContent = String(n);
      b.dataset.n = String(n);
      b.addEventListener('click', function () {
        if (call) return;
        call = parseInt(this.dataset.n, 10);
        showCounts();
        elCall.hidden = true;
        elBoard.classList.add('live');
      });
      elCallGrid.appendChild(b);
    }
  })();

  /* ---- ドラッグ（指の動き出しで向きを決め、離すと止まるマスまで滑る） ---- */
  var drag = null;

  function showGhost(idx, to) {
    var p = SlideRobots.xy(to);
    elGhost.className = '';
    elGhost.style.color = getComputedStyle(els[idx]).backgroundColor;
    setBox(elGhost, p.x, p.y, 1, 1);
    elGhost.hidden = false;
  }
  function hideGhost() { if (elGhost) elGhost.hidden = true; }

  function onDown(e) {
    if (finished || !call) return;
    drag = { id: parseInt(this.dataset.id, 10), el: this, sx: e.clientX, sy: e.clientY, dir: null, to: null };
    this.classList.add('dragging');
    try { this.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  }

  function onMove(e) {
    if (!drag || drag.el !== this) return;
    e.preventDefault();
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) < AXIS_LOCK && Math.abs(dy) < AXIS_LOCK) {
      drag.dir = null; drag.to = null; hideGhost();
      return;
    }
    var dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'E' : 'W') : (dy > 0 ? 'S' : 'N');
    if (dir === drag.dir) return;
    drag.dir = dir;
    drag.to = SlideRobots.slide(state, drag.id, dir);
    if (drag.to === null) hideGhost(); else showGhost(drag.id, drag.to);
  }

  function onUp(e) {
    if (!drag || drag.el !== this) return;
    var id = drag.id, dir = drag.dir, to = drag.to;
    drag = null;
    this.classList.remove('dragging');
    hideGhost();
    if (dir && to !== null && to !== undefined) doMove(id, dir, to);
  }

  function showCounts() {
    elCallOut.innerHTML = '手数 <b>' + moves + '</b> ／ 宣言 <b>' + call + '</b>';
  }
  function doMove(id, dir, to) {
    var from = state.robots[id];
    var dist = Math.abs(to - from) >= W ? Math.abs(to - from) / W : Math.abs(to - from);
    history.push(state);
    state = SlideRobots.applyMove(state, id, dir);
    moves++;
    showCounts();
    elUndo.disabled = false;
    place(id, dist);
    if (SlideRobots.isSolved(state)) {
      finished = true;
      elUndo.disabled = true;
      setTimeout(showClear, 320);
    }
  }

  function showClear() {
    var lv = LEVELS[levelIndex], min = lv.min;
    save.cleared[String(levelIndex)] = 1;
    storeSave();
    renderLevelList();
    elClearTitle.textContent = (moves === min) ? '★ 最短！' : 'クリア！';
    elClearVerdict.textContent = (moves <= call) ? '見立て通り' : '宣言より ' + (moves - call) + ' 手多い';
    elClearStats.innerHTML =
      '手数 <b>' + moves + '</b> ／ 宣言 <b>' + call + '</b> ／ 最短 <b>' + min + '</b>';
    var last = (levelIndex >= LEVELS.length - 1);
    elNext.hidden = last;
    if (last) elClearVerdict.textContent += '（これで最後）';
    elClear.hidden = false;
  }

  /* ---- ボタン ---- */
  elUndo.addEventListener('click', function () {
    if (finished || !history.length) return;
    state = history.pop();
    moves = Math.max(0, moves - 1);
    showCounts();
    elUndo.disabled = !history.length;
    hideGhost();
    place();
  });
  elReset.addEventListener('click', function () { loadLevel(levelIndex); });
  elNext.addEventListener('click', function () {
    if (levelIndex < LEVELS.length - 1) loadLevel(levelIndex + 1);
  });

  /* ---- レベル一覧 ---- */
  function renderLevelList() {
    if (!elLevels.childNodes.length) {
      var tiers = [], seen = {}, i, t, k;
      for (i = 0; i < LABELS.length; i++) {
        if (!seen[LABELS[i].tier]) { seen[LABELS[i].tier] = []; tiers.push(LABELS[i].tier); }
        seen[LABELS[i].tier].push(i);
      }
      for (t = 0; t < tiers.length; t++) {
        var box = document.createElement('div');
        box.className = 'tier';
        var name = document.createElement('div');
        name.className = 'tierName';
        name.textContent = tiers[t];
        box.appendChild(name);
        var row = document.createElement('div');
        row.className = 'tierRow';
        var idxs = seen[tiers[t]];
        for (k = 0; k < idxs.length; k++) {
          var b = document.createElement('button');
          b.className = 'lv';
          b.dataset.idx = String(idxs[k]);
          b.addEventListener('click', function () {
            loadLevel(parseInt(this.dataset.idx, 10));
            window.scrollTo(0, 0);
          });
          row.appendChild(b);
        }
        box.appendChild(row);
        elLevels.appendChild(box);
      }
    }
    var btns = elLevels.querySelectorAll('.lv');
    for (var j = 0; j < btns.length; j++) {
      var idx = parseInt(btns[j].dataset.idx, 10);
      btns[j].textContent = LABELS[idx].no + (save.cleared[String(idx)] ? '✓' : '');
      btns[j].className = 'lv'
        + (idx === levelIndex ? ' cur' : '');
    }
  }

  loadSave();
  loadLevel(save.last);
})();
</script>
</body>
</html>
