<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パズル箱</title>
<style>
  :root{--bg:#f5f4f1;--panel:#fff;--ink:#222;--sub:#6b6b6b;--frame:#c9c6be;--red:#c9483a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:480px;margin:0 auto;padding:22px 14px 40px}
  h1{font-size:22px;margin:0 0 16px;letter-spacing:.02em}
  a.game{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;background:var(--panel);border:1px solid var(--frame);border-radius:12px;color:inherit;text-decoration:none}
  a.game:active{background:#eeece7}
  .thumb{width:56px;height:56px;flex:0 0 56px;border:2px solid var(--sub);border-radius:8px;background:var(--panel);position:relative;overflow:hidden}
  .thumb i{position:absolute;border-radius:3px;background:#5b7fa6}
  .thumb i.red{background:var(--red)}
  .name{font-size:17px;font-weight:700}
  .desc{font-size:13px;color:var(--sub);margin-top:2px}
  .prog{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>パズル箱</h1>
  <a class="game" href="car-escape/">
    <div class="thumb"><i class="red" style="left:8px;top:22px;width:22px;height:9px"></i><i style="left:34px;top:6px;width:9px;height:24px"></i><i style="left:6px;top:36px;width:9px;height:14px"></i></div>
    <div><div class="name">車をだせ！</div><div class="desc">赤い車を右の出口へ</div></div>
    <div class="prog" data-key="car-escape" data-n="50"></div>
  </a>
  <a class="game" href="hakoiri-musume/">
    <div class="thumb" style="width:46px;flex-basis:46px"><i class="red" style="left:12px;top:5px;width:20px;height:20px"></i><i style="left:3px;top:5px;width:8px;height:20px"></i><i style="left:33px;top:5px;width:8px;height:20px"></i><i style="left:12px;top:27px;width:20px;height:8px"></i></div>
    <div><div class="name">箱入り娘</div><div class="desc">娘を下の出口へ</div></div>
    <div class="prog" data-key="hakoiri-musume" data-n="40"></div>
  </a>
</main>
<script>
/* 進み具合は各ゲームが同じオリジンの localStorage に置く {cleared:{idx:1}} を読むだけ */
(function () {
  var ps = document.querySelectorAll('.prog');
  for (var i = 0; i < ps.length; i++) {
    var n = 0;
    try {
      var o = JSON.parse(localStorage.getItem(ps[i].dataset.key) || 'null');
      if (o && o.cleared) n = Object.keys(o.cleared).length;
    } catch (e) {}
    ps[i].textContent = n ? n + ' / ' + ps[i].dataset.n : '';
  }
})();
</script>
</body>
</html>
