<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パズル箱</title>
<style>
  :root{--bg:#f5f4f1;--panel:#fff;--ink:#222;--sub:#6b6b6b;--frame:#c9c6be;--red:#c9483a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:480px;margin:0 auto;padding:22px 14px 40px}
  h1{font-size:22px;margin:0 0 16px;letter-spacing:.02em}
  a.game{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;background:var(--panel);border:1px solid var(--frame);border-radius:12px;color:inherit;text-decoration:none}
  a.game:active{background:#eeece7}
  .thumb{width:56px;height:56px;flex:0 0 56px;border:2px solid var(--sub);border-radius:8px;background:var(--panel);position:relative;overflow:hidden}
  .thumb i{position:absolute;border-radius:3px;background:#5b7fa6}
  .thumb i.red{background:var(--red)}
  .name{font-size:17px;font-weight:700}
  .desc{font-size:13px;color:var(--sub);margin-top:2px}
  .prog{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>パズル箱</h1>
  <a class="game" href="car-escape/">
    <div class="thumb"><i class="red" style="left:8px;top:22px;width:22px;height:9px"></i><i style="left:34px;top:6px;width:9px;height:24px"></i><i style="left:6px;top:36px;width:9px;height:14px"></i></div>
    <div><div class="name">車をだせ！</div><div class="desc">赤い車を右の出口へ</div></div>
    <div class="prog" data-key="car-escape" data-n="50"></div>
  </a>
  <a class="game" href="hakoiri-musume/">
    <div class="thumb" style="width:46px;flex-basis:46px"><i class="red" style="left:12px;top:5px;width:20px;height:20px"></i><i style="left:3px;top:5px;width:8px;height:20px"></i><i style="left:33px;top:5px;width:8px;height:20px"></i><i style="left:12px;top:27px;width:20px;height:8px"></i></div>
    <div><div class="name">箱入り娘</div><div class="desc">娘を下の出口へ</div></div>
    <div class="prog" data-key="hakoiri-musume" data-n="40"></div>
  </a>
  <a class="game" href="slide-robots/">
    <div class="thumb"><i class="red" style="left:8px;top:8px;width:10px;height:10px;border-radius:50%"></i><i style="left:34px;top:8px;width:10px;height:10px;border-radius:50%;background:#5b7fa6"></i><i style="left:8px;top:34px;width:10px;height:10px;border-radius:50%;background:#c9a83e"></i><i style="left:34px;top:34px;width:10px;height:10px;border-radius:50%;background:#6f8f6a"></i><i style="left:23px;top:23px;width:6px;height:6px;background:#222"></i></div>
    <div><div class="name">すべりロボ</div><div class="desc">何手で的に止められる？</div></div>
    <div class="prog" data-key="slide-robots" data-n="40"></div>
  </a>
  <a class="game" href="sudoku/">
    <div class="thumb" style="background-image:linear-gradient(to right,#c9c6be 0 1px,transparent 1px 33.3%),linear-gradient(to bottom,#c9c6be 0 1px,transparent 1px 33.3%);background-size:33.3% 33.3%"><span style="position:absolute;left:6px;top:2px;font-size:13px;font-weight:700">5</span><span style="position:absolute;left:24px;top:20px;font-size:13px;font-weight:700">3</span><span style="position:absolute;left:41px;top:37px;font-size:13px;font-weight:700;color:#3f6fb0">8</span></div>
    <div><div class="name">数独</div><div class="desc">9×9、解は一つ</div></div>
    <div class="prog" data-key="sudoku" data-n="40"></div>
  </a>
  <a class="game" href="mado-wake/">
    <div class="thumb"><i style="left:4px;top:4px;width:22px;height:14px;background:#c9a83e;border-radius:2px"></i><i style="left:28px;top:4px;width:20px;height:24px;background:#5b7fa6;border-radius:2px"></i><i style="left:4px;top:20px;width:22px;height:28px;background:#c9483a;border-radius:2px"></i><i style="left:28px;top:30px;width:20px;height:18px;background:#6f8f6a;border-radius:2px"></i></div>
    <div><div class="name">窓わけ</div><div class="desc">ルール通りに領域へ分ける</div></div>
    <div class="prog" data-key="mado-wake" data-n="40"></div>
  </a>
  <a class="game" href="hoshi-oki/">
    <div class="thumb"><i style="left:3px;top:3px;width:24px;height:24px;background:#dfe7d3;border-radius:3px"></i><i style="left:29px;top:3px;width:20px;height:14px;background:#d8dced;border-radius:3px"></i><i style="left:29px;top:19px;width:20px;height:30px;background:#efe3c8;border-radius:3px"></i><i style="left:3px;top:29px;width:24px;height:20px;background:#e8d9dc;border-radius:3px"></i><span style="position:absolute;left:9px;top:5px;font-size:14px">★</span><span style="position:absolute;left:33px;top:27px;font-size:14px">★</span></div>
    <div><div class="name">星おき</div><div class="desc">色・行・列に星を一つずつ</div></div>
    <div class="prog" data-key="hoshi-oki" data-n="40"></div>
  </a>
  <a class="game" href="pixel/">
    <div class="thumb" style="background-image:linear-gradient(to right,rgba(0,0,0,.08) 0 1px,transparent 1px 10px),linear-gradient(to bottom,rgba(0,0,0,.08) 0 1px,transparent 1px 10px);background-size:10px 10px">
      <i class="red" style="left:11px;top:11px;width:8px;height:8px;border-radius:1px"></i>
      <i class="red" style="left:27px;top:11px;width:8px;height:8px;border-radius:1px"></i>
      <i class="red" style="left:11px;top:19px;width:24px;height:8px;border-radius:1px"></i>
      <i class="red" style="left:15px;top:27px;width:16px;height:8px;border-radius:1px"></i>
      <i class="red" style="left:19px;top:35px;width:8px;height:8px;border-radius:1px"></i>
    </div>
    <div><div class="name">ピクセル</div><div class="desc">数字の通りに塗って絵を出す</div></div>
    <div class="prog" data-key="pixel" data-n="40"></div>
  </a>
</main>
<script>
/* 進み具合は各ゲームが同じオリジンの localStorage に置く {cleared:{idx:1}} を読むだけ */
(function () {
  var ps = document.querySelectorAll('.prog');
  for (var i = 0; i < ps.length; i++) {
    var n = 0;
    try {
      var o = JSON.parse(localStorage.getItem(ps[i].dataset.key) || 'null');
      if (o && o.cleared) n = Object.keys(o.cleared).length;
    } catch (e) {}
    ps[i].textContent = n ? n + ' / ' + ps[i].dataset.n : '';
  }
})();
</script>
</body>
</html>
