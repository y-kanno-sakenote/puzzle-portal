<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ピクセル</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#dedcd6; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --thick:#5d5952; --active:#3a3833;
    --hint-bg:#eae8e1; --highlight-bg:#e8e4db; --guide-bg:rgba(0,0,0,0.035);
    --guide-cross:rgba(0,0,0,0.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:440px;margin:0 auto;padding:10px 8px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px}
  #titleWrap{display:flex;align-items:baseline;gap:8px}
  #title{font-size:20px;font-weight:700;letter-spacing:.02em}
  #levelName{font-size:13.5px;color:var(--sub);font-weight:600}
  #headerActions{display:flex;align-items:center;gap:10px}
  #zoomBtn{
    font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;
    border:1px solid var(--frame);background:var(--panel);color:var(--ink);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  #zoomBtn:active{background:#eeece7}
  #portalLink{font-size:13px;color:var(--sub);text-decoration:none}
  #portalLink:hover{text-decoration:underline}

  #rules{padding:0 4px 8px;font-size:12px;line-height:1.5;color:var(--sub)}
  #rules div{white-space:nowrap}

  /* 盤面スクロールコンテナ */
  #stageWrapper{
    position:relative;width:100%;
    background:var(--panel);border:2px solid var(--thick);border-radius:8px;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  /* ズーム拡大モード時 */
  #stageWrapper.zoomed{
    overflow:auto;-webkit-overflow-scrolling:touch;
    max-height:68vh;
  }

  #boardWrapper{
    display:grid;
    grid-template-columns:auto 1fr;
    grid-template-rows:auto 1fr;
    padding:6px;
    width:fit-content;min-width:100%;
    margin:0 auto;
  }
  #corner{
    grid-column:1;grid-row:1;
    background:var(--panel);
    position:sticky;top:0;left:0;z-index:10;
  }

  /* 列ヒント（上部） */
  #colHints{
    grid-column:2;grid-row:1;
    display:grid;align-items:end;
    background:var(--panel);
    position:sticky;top:0;z-index:5;
  }
  .colHint{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    font-size:var(--hint-fs, 11px);font-weight:700;color:var(--ink);
    padding-bottom:3px;line-height:1.15;
    border-right:1px solid transparent;
    transition:background-color .15s;
  }
  .colHint.b-r5{border-right:2px solid var(--thick)}
  .colHint.active{background:var(--highlight-bg);border-radius:4px 4px 0 0}

  /* 行ヒント（左部） */
  #rowHints{
    grid-column:1;grid-row:2;
    display:grid;justify-items:end;
    background:var(--panel);
    position:sticky;left:0;z-index:5;
  }
  .rowHint{
    display:flex;align-items:center;justify-content:flex-end;gap:3px;
    font-size:var(--hint-fs, 11px);font-weight:700;color:var(--ink);
    padding-right:5px;white-space:nowrap;
    border-bottom:1px solid transparent;
    transition:background-color .15s;
  }
  .rowHint.b-b5{border-bottom:2px solid var(--thick)}
  .rowHint.active{background:var(--highlight-bg);border-radius:4px 0 0 4px}

  /* ヒント数字の個別スパン（タップでチェック可能） */
  .hintNum{
    cursor:pointer;padding:0 1px;border-radius:2px;display:inline-block;
  }
  .hintNum.checked{
    opacity:.25;text-decoration:line-through;
  }

  /* グリッド本体 */
  #grid{
    grid-column:2;grid-row:2;
    position:relative;display:grid;
    border:1px solid var(--thick);background:var(--panel);
    touch-action:none;
  }
  .cell{
    position:relative;
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    width:var(--cs, 26px);height:var(--cs, 26px);
  }
  .cell.re{border-right:0}
  .cell.be{border-bottom:0}
  /* 5マス区切りの太線 */
  .cell.b-r5{border-right:2px solid var(--thick)}
  .cell.b-b5{border-bottom:2px solid var(--thick)}

  /* 十字ガイドハイライト */
  .cell.guide-col, .cell.guide-row{background-color:var(--guide-bg)}
  .cell.guide-cross{background-color:var(--guide-cross)}

  /* セルの状態 */
  .cell.fill{background:var(--ink)}
  .cell.fill.guide-cross{background:#111111}
  .cell.x::after{
    content:"✕";
    font-size:calc(var(--cs, 26px) * 0.58);
    color:var(--sub);line-height:1;opacity:.7;
  }

  /* クリア時の演出 */
  #stageWrapper.cleared #colHints, #stageWrapper.cleared #rowHints{opacity:.25}
  #stageWrapper.cleared .cell.fill{background:var(--ink)}
  #stageWrapper.cleared .cell.x::after{display:none}
  #stageWrapper.cleared #grid{border-color:var(--ink)}
  #stageWrapper.cleared .cell.guide-col, #stageWrapper.cleared .cell.guide-row, #stageWrapper.cleared .cell.guide-cross{background-color:transparent}

  /* 完成メッセージバー */
  #clearBanner{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;margin-top:10px;
    background:#ebe7df;border-radius:8px;
  }
  #clearBanner[hidden]{display:none}
  #artTitle{font-size:16px;font-weight:700;color:var(--ink)}
  #artTitle span{font-size:13px;font-weight:400;color:var(--sub);margin-left:6px}

  /* 完成時の元絵（名画段階） */
  #artOrig{margin-top:10px}
  #artOrig img{display:block;width:auto;height:auto;max-width:min(100%,420px);max-height:56vh;margin:0 auto;border-radius:6px;background:#ebe7df}
  #artCredit{margin-top:6px;white-space:pre-line;font-size:11px;line-height:1.6;color:var(--sub);text-align:center}

  /* モード切り替え & ボタン */
  #controls{display:flex;gap:8px;margin-top:10px}
  .modeBtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 0;font-size:15px;font-weight:700;
    border:1.5px solid var(--frame);border-radius:8px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .modeBtn.active{
    background:var(--active);color:#ffffff;border-color:var(--active);
  }
  .modeBtn .dot{width:12px;height:12px;background:currentColor;border-radius:2px}
  .modeBtn .xmark{font-size:16px;line-height:1}

  #buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  button.actionBtn{
    font:inherit;padding:10px 0;border:1px solid var(--frame);
    border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;font-weight:500;
  }
  button.actionBtn:active{background:#eeece7}
  #nextBtn{
    grid-column:span 2;background:#44413c;color:#fff;border-color:#44413c;
    font-weight:700;padding:12px 0;
  }
  #nextBtn:active{background:#2a2825}

  /* レベル一覧 */
  #levels{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
  .tier{margin-bottom:14px}
  .tierName{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;letter-spacing:.04em}
  .tierRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .lv{
    padding:7px 0;font-size:13px;font-weight:600;
    border:1px solid var(--frame);border-radius:6px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .lv.cur{border-color:var(--ink);background:#eeece7;font-weight:700}
  .lv.clr{color:#5b784a}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="titleWrap">
      <span id="title">ピクセル</span>
      <span id="levelName"></span>
    </div>
    <div id="headerActions">
      <button id="zoomBtn" hidden>🔍 拡大</button>
      <a id="portalLink" href="../">パズル箱</a>
    </div>
  </header>

  <div id="rules">
    <div>行・列の数字の数だけマスを黒く塗る</div>
    <div>数字が複数のときは、間に1マス以上あける</div>
  </div>

  <div id="stageWrapper">
    <div id="boardWrapper">
      <div id="corner"></div>
      <div id="colHints"></div>
      <div id="rowHints"></div>
      <div id="grid"></div>
    </div>
  </div>

  <div id="clearBanner" hidden>
    <div id="artTitle"></div>
    <button id="nextBtnBanner" class="actionBtn" style="padding:6px 14px;background:#44413c;color:#fff;border:none">次へ ▶</button>
  </div>

  <div id="artOrig" hidden>
    <img id="artImg" alt="">
    <div id="artCredit"></div>
  </div>

  <div id="controls">
    <button id="modeFill" class="modeBtn active"><span class="dot"></span>塗る</button>
    <button id="modeCross" class="modeBtn"><span class="xmark">✕</span>印</button>
  </div>

  <div id="buttons">
    <button id="undoBtn" class="actionBtn">もどす</button>
    <button id="resetBtn" class="actionBtn">はじめから</button>
    <button id="nextBtn" class="actionBtn" hidden>次の問題へ</button>
  </div>

  <div id="levels"></div>
</div>

   純粋ロジック（テスト容易性のため独立させ、window.Pixel として公開する）
---------------------------------------------------------------- */

  isSolution: function(puzzle, state) {
    var sol = puzzle.solution;
    var len = sol.length;
    for (var i = 0; i < len; i++) {
      var expected = (sol.charAt(i) === '1');
      var actual = (state[i] === 1);
      if (expected !== actual) return false;
    }
    return true;
  }
};

(function() {
  var elStageWrapper = document.getElementById('stageWrapper');
  var elGrid = document.getElementById('grid');
  var elColHints = document.getElementById('colHints');
  var elRowHints = document.getElementById('rowHints');
  var elLevelName = document.getElementById('levelName');
  var elClearBanner = document.getElementById('clearBanner');

  var elArtOrig = document.getElementById('artOrig');
  var artImg = document.getElementById('artImg');
  var artCredit = document.getElementById('artCredit');
  var btnZoom = document.getElementById('zoomBtn');
  var btnModeFill = document.getElementById('modeFill');
  var btnModeCross = document.getElementById('modeCross');
  var btnUndo = document.getElementById('undoBtn');
  var btnReset = document.getElementById('resetBtn');
  var btnNext = document.getElementById('nextBtn');
  var btnNextBanner = document.getElementById('nextBtnBanner');
  var elLevels = document.getElementById('levels');

  var currentIdx = 0;
  var currentPuzzle = null;
  var gridState = []; // 0=空, 1=黒, 2=×
  var history = [];
  var isCleared = false;
  var currentInputMode = 'fill'; // 'fill' or 'cross'
  var isZoomed = false;

  // 十字ハイライト追従
  var activeRow = -1;
  var activeCol = -1;

  // ドラッグ操作関連
  var isDragging = false;
  var dragAction = null;
  var lastTargetCell = -1;

  // 保存管理
  /* 2026-09-09 問題を50問に組み替えた。添字がずれるので旧キー 'pixel' は読まない */
  var SAVE_KEY = 'pixel-v2';
  var save = { cleared: {}, last: 0, grid: {} };

  function loadSave() {
    try {
      var s = localStorage.getItem(SAVE_KEY);
      if (s) {
        var parsed = JSON.parse(s);
        if (parsed && typeof parsed === 'object') {
          save.cleared = parsed.cleared || {};
          save.last = (Number.isInteger(parsed.last) && parsed.last >= 0 && parsed.last < PUZZLES.length) ? parsed.last : 0;
          save.grid = parsed.grid || {};
        }
      }
    } catch(e) {}
  }

  function persist() {
    try {
      save.last = currentIdx;
      if (!isCleared) {
        save.grid[String(currentIdx)] = gridState.join('');
      } else {
        delete save.grid[String(currentIdx)];
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch(e) {}
  }

  /* レベル読み込み */
  function loadLevel(idx) {
    if (idx < 0 || idx >= PUZZLES.length) idx = 0;
    currentIdx = idx;
    currentPuzzle = PUZZLES[idx];
    history = [];
    isCleared = false;
    activeRow = -1;
    activeCol = -1;

    elStageWrapper.classList.remove('cleared');
    elClearBanner.hidden = true;
    btnNext.hidden = true;
    // 元絵は完成するまで読み込まない（src を入れない）
    elArtOrig.hidden = true;
    artImg.removeAttribute('src');
    artImg.alt = '';
    artCredit.textContent = '';

    // ズームボタンの表示制御（15x15以上は大盤面としてズーム可能）
    var isLarge = (currentPuzzle.w >= 15 || currentPuzzle.h >= 15);
    btnZoom.hidden = !isLarge;
    // 初期状態は等倍
    setZoom(false);

    elLevelName.textContent = currentPuzzle.tier + ' ' + (currentIdx + 1) + ' / ' + PUZZLES.length + ' (' + currentPuzzle.w + '×' + currentPuzzle.h + ')';

    var totalCells = currentPuzzle.w * currentPuzzle.h;
    gridState = [];
    for (var i = 0; i < totalCells; i++) gridState.push(0);

    // 保存盤面の復元
    if (save.grid[String(currentIdx)]) {
      var savedStr = save.grid[String(currentIdx)];
      for (var j = 0; j < Math.min(totalCells, savedStr.length); j++) {
        gridState[j] = parseInt(savedStr.charAt(j), 10) || 0;
      }
    }

    setupDOM();
    renderBoard();
    renderLevelList();
    persist();
  }

  /* ズーム設定 */
  function setZoom(zoomed) {
    isZoomed = zoomed;
    elStageWrapper.classList.toggle('zoomed', isZoomed);
    btnZoom.textContent = isZoomed ? '📱 全体' : '🔍 拡大';
    calculateSizes();
  }
  btnZoom.addEventListener('click', function() {
    setZoom(!isZoomed);
  });

  /* 動的サイズ計算 */
  function calculateSizes() {
    if (!currentPuzzle) return;
    var w = currentPuzzle.w;
    var h = currentPuzzle.h;

    // 画面幅（マージン除く）
    var availWidth = Math.min(window.innerWidth - 32, 420);
    var cs, fs;

    if (isZoomed) {
      // 拡大時：指で確実に押せるサイズ（最低23px）
      cs = 24;
      fs = 11;
    } else {
      // 等倍時：画面幅に合わせて可変
      if (w <= 5) {
        cs = 48; fs = 13;
      } else if (w <= 10) {
        cs = Math.floor((availWidth - 70) / w);
        if (cs > 28) cs = 28;
        if (cs < 22) cs = 22;
        fs = 11;
      } else if (w <= 15) {
        cs = Math.floor((availWidth - 85) / w);
        if (cs < 16) cs = 16;
        fs = 9.5;
      } else { // 25x25等
        cs = Math.floor((availWidth - 95) / w);
        if (cs < 11) cs = 11;
        fs = 8;
      }
    }

    elStageWrapper.style.setProperty('--cs', cs + 'px');
    elStageWrapper.style.setProperty('--hint-fs', fs + 'px');
  }

  window.addEventListener('resize', calculateSizes);

  /* 盤面DOM構築 */
  function setupDOM() {
    var w = currentPuzzle.w;
    var h = currentPuzzle.h;
    calculateSizes();

    // 上部ヒント
    elColHints.innerHTML = '';
    elColHints.style.gridTemplateColumns = 'repeat(' + w + ', var(--cs))';
    for (var c = 0; c < w; c++) {
      var colDiv = document.createElement('div');
      colDiv.className = 'colHint';
      colDiv.dataset.col = String(c);
      if ((c + 1) % 5 === 0 && c !== w - 1) colDiv.classList.add('b-r5');

      var hints = currentPuzzle.colHints[c];
      if (hints.length === 1 && hints[0] === 0) {
        var span = document.createElement('span');
        span.className = 'hintNum';
        span.textContent = '0';
        span.style.opacity = '0.35';
        colDiv.appendChild(span);
      } else {
        for (var hi = 0; hi < hints.length; hi++) {
          var numSpan = document.createElement('span');
          numSpan.className = 'hintNum';
          numSpan.textContent = String(hints[hi]);
          numSpan.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('checked');
          });
          colDiv.appendChild(numSpan);
        }
      }
      elColHints.appendChild(colDiv);
    }

    // 左部ヒント
    elRowHints.innerHTML = '';
    elRowHints.style.gridTemplateRows = 'repeat(' + h + ', var(--cs))';
    for (var r = 0; r < h; r++) {
      var rowDiv = document.createElement('div');
      rowDiv.className = 'rowHint';
      rowDiv.dataset.row = String(r);
      if ((r + 1) % 5 === 0 && r !== h - 1) rowDiv.classList.add('b-b5');

      var rHints = currentPuzzle.rowHints[r];
      if (rHints.length === 1 && rHints[0] === 0) {
        var rSpan = document.createElement('span');
        rSpan.className = 'hintNum';
        rSpan.textContent = '0';
        rSpan.style.opacity = '0.35';
        rowDiv.appendChild(rSpan);
      } else {
        for (var rhi = 0; rhi < rHints.length; rhi++) {
          var rNumSpan = document.createElement('span');
          rNumSpan.className = 'hintNum';
          rNumSpan.textContent = String(rHints[rhi]);
          rNumSpan.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('checked');
          });
          rowDiv.appendChild(rNumSpan);
        }
      }
      elRowHints.appendChild(rowDiv);
    }

    // グリッド
    elGrid.innerHTML = '';
    elGrid.style.gridTemplateColumns = 'repeat(' + w + ', var(--cs))';
    elGrid.style.gridTemplateRows = 'repeat(' + h + ', var(--cs))';

    for (var i = 0; i < h; i++) {
      for (var j = 0; j < w; j++) {
        var cellIdx = i * w + j;
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = String(cellIdx);
        cell.dataset.r = String(i);
        cell.dataset.c = String(j);
        if (j === w - 1) cell.classList.add('re');
        if (i === h - 1) cell.classList.add('be');
        // 5マスごとの境界太線
        if ((j + 1) % 5 === 0 && j !== w - 1) cell.classList.add('b-r5');
        if ((i + 1) % 5 === 0 && i !== h - 1) cell.classList.add('b-b5');
        elGrid.appendChild(cell);
      }
    }
  }

  /* 十字ハイライト更新 */
  function updateCrosshair(r, c) {
    if (r === activeRow && c === activeCol) return;
    activeRow = r;
    activeCol = c;

    // ヒントのハイライト
    var colNodes = elColHints.children;
    for (var j = 0; j < colNodes.length; j++) {
      colNodes[j].classList.toggle('active', j === c);
    }
    var rowNodes = elRowHints.children;
    for (var i = 0; i < rowNodes.length; i++) {
      rowNodes[i].classList.toggle('active', i === r);
    }

    // グリッドセルのハイライト
    var cells = elGrid.children;
    var w = currentPuzzle.w;
    for (var k = 0; k < cells.length; k++) {
      var cr = Math.floor(k / w);
      var cc = k % w;
      var isRow = (cr === r);
      var isCol = (cc === c);
      cells[k].classList.toggle('guide-row', isRow && !isCol);
      cells[k].classList.toggle('guide-col', isCol && !isRow);
      cells[k].classList.toggle('guide-cross', isRow && isCol);
    }
  }

  function clearCrosshair() {
    activeRow = -1;
    activeCol = -1;
    var colNodes = elColHints.children;
    for (var j = 0; j < colNodes.length; j++) colNodes[j].classList.remove('active');
    var rowNodes = elRowHints.children;
    for (var i = 0; i < rowNodes.length; i++) rowNodes[i].classList.remove('active');
    var cells = elGrid.children;
    for (var k = 0; k < cells.length; k++) {
      cells[k].classList.remove('guide-row', 'guide-col', 'guide-cross');
    }
  }

  /* セル描画更新 */
  function renderBoard() {
    var cells = elGrid.children;
    for (var i = 0; i < cells.length; i++) {
      var val = gridState[i];
      cells[i].classList.toggle('fill', val === 1);
      cells[i].classList.toggle('x', val === 2);
    }
  }

  function pushHistory() {
    history.push(gridState.slice());
    if (history.length > 50) history.shift();
  }

  /* 判定 */
  function judge() {
    if (Pixel.isSolution(currentPuzzle, gridState)) {
      isCleared = true;
      save.cleared[String(currentIdx)] = 1;
      persist();

      clearCrosshair();
      elStageWrapper.classList.add('cleared');
      artTitle.innerHTML = currentPuzzle.title + ' <span>完成！</span>';
      elClearBanner.hidden = false;

      // 名画段階だけ、完成した瞬間に元絵をカラーで出す（ここで初めて読み込む）
      var a = currentPuzzle.art;
      if (a) {
        artImg.alt = a.artist + '「' + a.title + '」';
        artImg.src = a.file;
        /* 和題が当方の訳のときは〔訳〕を付け、所蔵機関の記録題も必ず出す */
    artCredit.textContent = a.artist + '　' + a.title + (a.tr ? '〔訳〕' : '') + '　' + a.date
      + '\n' + a.holder + '蔵　' + a.license + '　原記録: ' + a.title_src;
        elArtOrig.hidden = false;
      }

      btnNext.hidden = (currentIdx >= PUZZLES.length - 1);
      renderLevelList();
    }
  }

  /* セル位置判定 */
  function getCellFromEvent(e) {
    var target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target) return null;
    var cell = target.closest('.cell');
    if (!cell || !elGrid.contains(cell)) return null;
    return cell;
  }

  /* 入力適用 */
  function applyActionToCell(idx, action) {
    if (idx < 0 || idx >= gridState.length) return;
    gridState[idx] = action;
  }

  /* ポインターイベント（タップ & なぞりドラッグ & 十字追従） */
  elGrid.addEventListener('pointerdown', function(e) {
    if (isCleared) return;
    var cell = getCellFromEvent(e);
    if (!cell) return;
    var idx = parseInt(cell.dataset.idx, 10);
    var r = parseInt(cell.dataset.r, 10);
    var c = parseInt(cell.dataset.c, 10);

    e.preventDefault();
    isDragging = true;
    lastTargetCell = idx;
    pushHistory();

    updateCrosshair(r, c);

    var cur = gridState[idx];
    if (currentInputMode === 'fill') {
      dragAction = (cur === 1) ? 0 : 1;
    } else {
      dragAction = (cur === 2) ? 0 : 2;
    }

    applyActionToCell(idx, dragAction);
    renderBoard();
  });

  window.addEventListener('pointermove', function(e) {
    if (isCleared) return;
    var cell = getCellFromEvent(e);
    if (!cell) return;
    var idx = parseInt(cell.dataset.idx, 10);
    var r = parseInt(cell.dataset.r, 10);
    var c = parseInt(cell.dataset.c, 10);

    updateCrosshair(r, c);

    if (!isDragging || idx === lastTargetCell) return;
    lastTargetCell = idx;
    applyActionToCell(idx, dragAction);
    renderBoard();
  });

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    lastTargetCell = -1;
    persist();
    judge();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* モード切り替え */
  btnModeFill.addEventListener('click', function() {
    currentInputMode = 'fill';
    btnModeFill.classList.add('active');
    btnModeCross.classList.remove('active');
  });
  btnModeCross.addEventListener('click', function() {
    currentInputMode = 'cross';
    btnModeCross.classList.add('active');
    btnModeFill.classList.remove('active');
  });

  /* 操作ボタン */
  btnUndo.addEventListener('click', function() {
    if (isCleared || !history.length) return;
    gridState = history.pop();
    renderBoard();
    persist();
  });

  btnReset.addEventListener('click', function() {
    if (isCleared) return;
    pushHistory();
    for (var i = 0; i < gridState.length; i++) gridState[i] = 0;
    renderBoard();
    persist();
  });

  function goNext() {
    if (currentIdx < PUZZLES.length - 1) {
      loadLevel(currentIdx + 1);
      window.scrollTo(0, 0);
    }
  }
  btnNext.addEventListener('click', goNext);
  btnNextBanner.addEventListener('click', goNext);

  /* レベル一覧描画 */
  function renderLevelList() {
    elLevels.innerHTML = '';
    var tiers = [];
    var seenTiers = {};
    for (var p = 0; p < PUZZLES.length; p++) {
      var t = PUZZLES[p].tier;
      if (!seenTiers[t]) {
        seenTiers[t] = true;
        tiers.push(t);
      }
    }

    for (var tIdx = 0; tIdx < tiers.length; tIdx++) {
      var tierName = tiers[tIdx];
      var tierBox = document.createElement('div');
      tierBox.className = 'tier';

      var titleDiv = document.createElement('div');
      titleDiv.className = 'tierName';
      titleDiv.textContent = tierName;
      tierBox.appendChild(titleDiv);

      var rowDiv = document.createElement('div');
      rowDiv.className = 'tierRow';

      for (var i = 0; i < PUZZLES.length; i++) {
        if (PUZZLES[i].tier !== tierName) continue;
        var btn = document.createElement('button');
        btn.className = 'lv';
        btn.dataset.idx = String(i);
        btn.textContent = String(i + 1);
        btn.addEventListener('click', function() {
          loadLevel(parseInt(this.dataset.idx, 10));
          window.scrollTo(0, 0);
        });
        rowDiv.appendChild(btn);
      }
      tierBox.appendChild(rowDiv);
      elLevels.appendChild(tierBox);
    }

    var btns = elLevels.querySelectorAll('.lv');
    for (var j = 0; j < btns.length; j++) {
      var idx = parseInt(btns[j].dataset.idx, 10);
      var clr = save.cleared[String(idx)];
      btns[j].textContent = String(idx + 1) + (clr ? ' ✓' : '');
      btns[j].className = 'lv' + (idx === currentIdx ? ' cur' : '') + (clr ? ' clr' : '');
    }
  }

  loadSave();
  loadLevel(save.last);
})();
</script>
</body>
</html>
