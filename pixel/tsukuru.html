<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ピクセル｜じぶんで作る</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#dedcd6; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --thick:#5d5952; --active:#3a3833;
    --hint-bg:#eae8e1; --highlight-bg:#e8e4db; --guide-bg:rgba(0,0,0,0.035);
    --guide-cross:rgba(0,0,0,0.07);
    --ok-bg:#e4ecdd; --ok-ink:#40603a; --ng-bg:#efe6e0; --ng-ink:#7a5844;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:440px;margin:0 auto;padding:10px 8px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px}
  #titleWrap{display:flex;align-items:baseline;gap:8px}
  #title{font-size:20px;font-weight:700;letter-spacing:.02em}
  #subName{font-size:13.5px;color:var(--sub);font-weight:600}
  #headerActions{display:flex;align-items:center;gap:10px}
  .navLink{font-size:13px;color:var(--sub);text-decoration:none}
  .navLink:hover{text-decoration:underline}

  #rules{padding:0 4px 8px;font-size:12px;line-height:1.5;color:var(--sub)}
  #rules div{white-space:nowrap}

  /* 大きさ選び */
  #sizeRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .sizeBtn{
    padding:8px 0;font:inherit;font-size:13px;font-weight:600;
    border:1px solid var(--frame);border-radius:6px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .sizeBtn.cur{background:var(--active);color:#fff;border-color:var(--active);font-weight:700}

  /* 盤面スクロールコンテナ */
  .stageWrapper{
    position:relative;width:100%;
    background:var(--panel);border:2px solid var(--thick);border-radius:8px;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .stageWrapper.zoomed{overflow:auto;-webkit-overflow-scrolling:touch;max-height:68vh}

  .boardWrapper{
    display:grid;
    grid-template-columns:auto auto;
    grid-template-rows:auto 1fr;
    justify-content:center;
    padding:6px;
    width:fit-content;min-width:100%;
    margin:0 auto;
  }
  .corner{grid-column:1;grid-row:1;background:var(--panel);position:sticky;top:0;left:0;z-index:10}
  .colHints{
    grid-column:2;grid-row:1;
    display:grid;align-items:end;
    background:var(--panel);position:sticky;top:0;z-index:5;
  }
  .colHint{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    font-size:var(--hint-fs, 11px);font-weight:700;color:var(--ink);
    padding-bottom:3px;line-height:1.15;
    border-right:1px solid transparent;transition:background-color .15s;
  }
  .colHint.b-r5{border-right:2px solid var(--thick)}
  .colHint.active{background:var(--highlight-bg);border-radius:4px 4px 0 0}

  .rowHints{
    grid-column:1;grid-row:2;
    display:grid;justify-items:end;
    background:var(--panel);position:sticky;left:0;z-index:5;
  }
  .rowHint{
    display:flex;align-items:center;justify-content:flex-end;gap:3px;
    font-size:var(--hint-fs, 11px);font-weight:700;color:var(--ink);
    padding-right:5px;white-space:nowrap;
    border-bottom:1px solid transparent;transition:background-color .15s;
  }
  .rowHint.b-b5{border-bottom:2px solid var(--thick)}
  .rowHint.active{background:var(--highlight-bg);border-radius:4px 0 0 4px}

  .hintNum{cursor:pointer;padding:0 1px;border-radius:2px;display:inline-block}
  .hintNum.checked{opacity:.25;text-decoration:line-through}

  .gridBox{
    grid-column:2;grid-row:2;
    position:relative;display:grid;
    border:1px solid var(--thick);background:var(--panel);
    touch-action:none;
  }
  .cell{
    position:relative;
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:var(--cs, 26px);height:var(--cs, 26px);
  }
  .cell.re{border-right:0}
  .cell.be{border-bottom:0}
  .cell.b-r5{border-right:2px solid var(--thick)}
  .cell.b-b5{border-bottom:2px solid var(--thick)}
  .cell.guide-col, .cell.guide-row{background-color:var(--guide-bg)}
  .cell.guide-cross{background-color:var(--guide-cross)}
  .cell.fill{background:var(--ink)}
  .cell.fill.guide-cross{background:#111111}
  .cell.x::after{
    content:"✕";font-size:calc(var(--cs, 26px) * 0.58);
    color:var(--sub);line-height:1;opacity:.7;
  }

  .stageWrapper.cleared .colHints, .stageWrapper.cleared .rowHints{opacity:.25}
  .stageWrapper.cleared .cell.x::after{display:none}
  .stageWrapper.cleared .gridBox{border-color:var(--ink)}
  .stageWrapper.cleared .cell.guide-col,
  .stageWrapper.cleared .cell.guide-row,
  .stageWrapper.cleared .cell.guide-cross{background-color:transparent}

  /* ボタン類 */
  #buttonsMake{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  #buttonsPlay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  button.actionBtn{
    font:inherit;padding:10px 0;border:1px solid var(--frame);
    border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;font-weight:500;
  }
  button.actionBtn:active{background:#eeece7}
  button.primary{background:#44413c;color:#fff;border-color:#44413c;font-weight:700;padding:12px 0}
  button.primary:active{background:#2a2825}
  button.primary[disabled]{background:#c4c1bb;border-color:#c4c1bb;color:#f3f2ef;cursor:default}
  .wide{grid-column:span 2}

  #controls{display:flex;gap:8px;margin-top:10px}
  .modeBtn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 0;font-size:15px;font-weight:700;
    border:1.5px solid var(--frame);border-radius:8px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .modeBtn.active{background:var(--active);color:#ffffff;border-color:var(--active)}
  .modeBtn .dot{width:12px;height:12px;background:currentColor;border-radius:2px}
  .modeBtn .xmark{font-size:16px;line-height:1}

  /* 名前 */
  #nameRow{display:flex;align-items:center;gap:8px;margin-top:10px}
  #nameRow label{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap}
  #titleInput{
    flex:1;font:inherit;font-size:15px;padding:9px 10px;
    border:1px solid var(--frame);border-radius:8px;background:var(--panel);color:var(--ink);
  }

  /* 判定の結果 */
  #verdict{margin-top:10px;padding:11px 13px;border-radius:8px;font-size:14px;line-height:1.6}
  #verdict[hidden]{display:none}
  #verdict.ok{background:var(--ok-bg);color:var(--ok-ink)}
  #verdict.ng{background:var(--ng-bg);color:var(--ng-ink)}
  #verdict b{font-size:15px}
  #verdict .note{display:block;margin-top:3px;font-size:12.5px;opacity:.85}

  #shareNote{margin-top:6px;font-size:12.5px;color:var(--sub);min-height:1.2em;word-break:break-all}

  /* 完成メッセージ */
  #clearBanner{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;margin-top:10px;background:#ebe7df;border-radius:8px;
  }
  #clearBanner[hidden]{display:none}
  #artTitle{font-size:16px;font-weight:700;color:var(--ink)}
  #artTitle span{font-size:13px;font-weight:400;color:var(--sub);margin-left:6px}

  /* つくったもの */
  #made{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
  #made[hidden]{display:none}
  #madeTitle{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;letter-spacing:.04em}
  .madeItem{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;margin-bottom:6px;
    border:1px solid var(--frame);border-radius:6px;background:var(--panel);
  }
  .madeItem .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .madeItem .mt{font-size:11.5px;color:var(--sub);margin-left:6px;font-weight:400}
  .madeItem button{
    font:inherit;font-size:12.5px;padding:5px 10px;white-space:nowrap;
    border:1px solid var(--frame);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;
  }

  #broken{margin-top:20px;padding:14px;border-radius:8px;background:var(--ng-bg);color:var(--ng-ink);font-size:14px}
  #broken[hidden]{display:none}
  .screen[hidden]{display:none}
</style>
</head>
<body>

<script>
/* ================================================================
   純粋ロジック（DOM 非依存・window.PixelTsukuru として公開）
   ラインソルバーと難度指標 D は tools/gen_puzzles.py の
   solve_with_metrics をそのまま移したもの。
================================================================ */
(function(){
  'use strict';

  /* ---- ヒント（行・列の数字） ---- */
  function hints(bits, w, h){
    var rowHints = [], colHints = [], r, c, cur, arr;
    for (r = 0; r < h; r++) {
      arr = []; cur = 0;
      for (c = 0; c < w; c++) {
        if (bits.charAt(r * w + c) === '1') cur++;
        else if (cur > 0) { arr.push(cur); cur = 0; }
      }
      if (cur > 0) arr.push(cur);
      rowHints.push(arr.length ? arr : [0]);
    }
    for (c = 0; c < w; c++) {
      arr = []; cur = 0;
      for (r = 0; r < h; r++) {
        if (bits.charAt(r * w + c) === '1') cur++;
        else if (cur > 0) { arr.push(cur); cur = 0; }
      }
      if (cur > 0) arr.push(cur);
      colHints.push(arr.length ? arr : [0]);
    }
    return { rowHints: rowHints, colHints: colHints };
  }

  /* ---- 1ライン分の確定推論（全パターン列挙と同じ結論を DP で出す） ----
     vals: -1 未確定 / 0 空 / 1 黒。戻り値は同じ形式の配列。矛盾なら null */
  function lineDeduce(vals, hs){
    var L = vals.length, i, j, t;
    var blocks = (hs.length === 1 && hs[0] === 0) ? [] : hs;
    var k = blocks.length;

    var okZero = new Array(L + 1);
    okZero[L] = true;
    for (i = L - 1; i >= 0; i--) okZero[i] = okZero[i + 1] && vals[i] !== 1;

    var back = new Array(L + 1);
    for (i = 0; i <= L; i++) {
      back[i] = new Array(k + 1);
      for (j = 0; j <= k; j++) back[i][j] = false;
      back[i][k] = okZero[i];
    }
    for (j = k - 1; j >= 0; j--) {
      var b = blocks[j];
      for (i = L; i >= 0; i--) {
        var ok = false;
        if (i < L && vals[i] !== 1 && back[i + 1][j]) ok = true;
        if (!ok && i + b <= L) {
          var fits = true;
          for (t = i; t < i + b; t++) { if (vals[t] === 0) { fits = false; break; } }
          if (fits) {
            if (i + b === L) ok = back[L][j + 1];
            else if (vals[i + b] !== 1) ok = back[i + b + 1][j + 1];
          }
        }
        back[i][j] = ok;
      }
    }
    if (!back[0][0]) return null;

    var can0 = new Array(L), can1 = new Array(L);
    for (i = 0; i < L; i++) { can0[i] = false; can1[i] = false; }
    var reach = new Array(L + 1);
    for (i = 0; i <= L; i++) {
      reach[i] = new Array(k + 1);
      for (j = 0; j <= k; j++) reach[i][j] = false;
    }
    reach[0][0] = true;
    for (i = 0; i <= L; i++) {
      for (j = 0; j <= k; j++) {
        if (!reach[i][j] || !back[i][j]) continue;
        if (i < L && vals[i] !== 1 && back[i + 1][j]) { can0[i] = true; reach[i + 1][j] = true; }
        if (j < k) {
          var bl = blocks[j];
          if (i + bl <= L) {
            var fit = true;
            for (t = i; t < i + bl; t++) { if (vals[t] === 0) { fit = false; break; } }
            if (fit) {
              var ni = -1;
              if (i + bl === L) { if (back[L][j + 1]) ni = L; }
              else if (vals[i + bl] !== 1 && back[i + bl + 1][j + 1]) ni = i + bl + 1;
              if (ni >= 0) {
                for (t = i; t < i + bl; t++) can1[t] = true;
                if (i + bl < L) can0[i + bl] = true;
                reach[ni][j + 1] = true;
              }
            }
          }
        }
      }
    }
    var out = new Array(L);
    for (i = 0; i < L; i++) {
      if (can0[i] && can1[i]) out[i] = -1;
      else if (can1[i]) out[i] = 1;
      else if (can0[i]) out[i] = 0;
      else return null;
    }
    return out;
  }

  /* ---- 候補パターン総数 S（探索空間の大きさ・情報用） ---- */
  function comb(n, k){
    if (k < 0 || n < 0 || k > n) return 0;
    var r = 1;
    for (var i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }
  function lineSpace(L, hs){
    if (hs.length === 1 && hs[0] === 0) return 1;
    var s = 0;
    for (var i = 0; i < hs.length; i++) s += hs[i];
    return comb(L - s + 1, hs.length);
  }

  /* ---- 計測付きラインソルバー（gen_puzzles.py solve_with_metrics と同じ手順） ---- */
  function solveMetrics(rowHints, colHints, w, h){
    var grid = new Array(w * h), i, r, c;
    for (i = 0; i < w * h; i++) grid[i] = -1;

    var space = 0;
    for (r = 0; r < h; r++) space += lineSpace(w, rowHints[r]);
    for (c = 0; c < w; c++) space += lineSpace(h, colHints[c]);

    var passes = 0, work = 0, rest1 = null, changed = true, vals, res, got, t;

    while (changed) {
      changed = false;
      passes++;
      for (r = 0; r < h; r++) {
        vals = new Array(w);
        for (c = 0; c < w; c++) vals[c] = grid[r * w + c];
        res = lineDeduce(vals, rowHints[r]);
        if (!res) return { ok:false, grid:grid, P:passes, W:work, R1:w * h, S:space, D:1000000 };
        got = false;
        for (c = 0; c < w; c++) {
          if (grid[r * w + c] === -1 && res[c] !== -1) { grid[r * w + c] = res[c]; changed = true; got = true; }
        }
        if (got) work++;
      }
      for (c = 0; c < w; c++) {
        vals = new Array(h);
        for (r = 0; r < h; r++) vals[r] = grid[r * w + c];
        res = lineDeduce(vals, colHints[c]);
        if (!res) return { ok:false, grid:grid, P:passes, W:work, R1:w * h, S:space, D:1000000 };
        got = false;
        for (r = 0; r < h; r++) {
          if (grid[r * w + c] === -1 && res[r] !== -1) { grid[r * w + c] = res[r]; changed = true; got = true; }
        }
        if (got) work++;
      }
      if (passes === 1) {
        t = 0;
        for (i = 0; i < w * h; i++) if (grid[i] === -1) t++;
        rest1 = t;
      }
    }
    if (rest1 === null) rest1 = 0;
    var complete = true;
    for (i = 0; i < w * h; i++) if (grid[i] === -1) { complete = false; break; }
    return { ok:complete, grid:grid, P:passes, W:work, R1:rest1, S:space, D: passes * 20 + work * 2 + rest1 };
  }

  /* ---- 仮定なしで解けるか。解けたら盤（0/1 の配列）、無理なら null ---- */
  function lineSolve(rowHints, colHints, w, h){
    var m = solveMetrics(rowHints, colHints, w, h);
    return m.ok ? m.grid : null;
  }

  /* ---- 解の数を数える（limit で打ち切る）----
     ラインソルバーで伝播し、行き詰まったら1マスだけ仮定して枝分かれする。
     ここでの仮定は「解が2通り以上あるか」を機械が確かめるためだけに使う。
     戻り値 { count, aborted }。aborted は打ち切り（時間・手数の上限） */
  function countSolutions(rowHints, colHints, w, h, limit, budget){
    limit = limit || 2;
    var maxNodes = (budget && budget.nodes) || 6000;
    var maxMs = (budget && budget.ms) || 2000;
    var t0 = (typeof Date !== 'undefined') ? Date.now() : 0;
    var count = 0, nodes = 0, aborted = false;

    function propagate(grid){
      var changed = true, r, c, vals, res, i;
      while (changed) {
        changed = false;
        for (r = 0; r < h; r++) {
          vals = new Array(w);
          for (c = 0; c < w; c++) vals[c] = grid[r * w + c];
          res = lineDeduce(vals, rowHints[r]);
          if (!res) return false;
          for (c = 0; c < w; c++) {
            if (grid[r * w + c] === -1 && res[c] !== -1) { grid[r * w + c] = res[c]; changed = true; }
          }
        }
        for (c = 0; c < w; c++) {
          vals = new Array(h);
          for (r = 0; r < h; r++) vals[r] = grid[r * w + c];
          res = lineDeduce(vals, colHints[c]);
          if (!res) return false;
          for (r = 0; r < h; r++) {
            if (grid[r * w + c] === -1 && res[r] !== -1) { grid[r * w + c] = res[r]; changed = true; }
          }
        }
      }
      return true;
    }

    function rec(grid){
      if (count >= limit || aborted) return;
      nodes++;
      if (nodes > maxNodes || (Date.now() - t0) > maxMs) { aborted = true; return; }
      if (!propagate(grid)) return;
      var idx = -1, i;
      for (i = 0; i < grid.length; i++) { if (grid[i] === -1) { idx = i; break; } }
      if (idx < 0) { count++; return; }
      var g1 = grid.slice(); g1[idx] = 1; rec(g1);
      if (count >= limit || aborted) return;
      var g0 = grid.slice(); g0[idx] = 0; rec(g0);
    }

    var start = new Array(w * h);
    for (var i = 0; i < w * h; i++) start[i] = -1;
    rec(start);
    return { count: count, aborted: aborted };
  }

  /* ---- 難度の段階（docs/spec.md「段階ごとの D レンジ」実測表が根拠）----
     D は同じ盤面サイズの中でだけ比べられる。よってサイズごとの刻みを持つ。
     10×10: 初級 70〜128 / 中級 132〜156 / 上級 170〜228（境目はその中間）
     15×15: 特級 146〜250
     25×25: 達人 439〜629
     20×20 は実測がないのでマス数で 15×15 と 25×25 の間を線形に取った目安 */
  var TIER_CUTS = {
    10: [[70, '入門'], [131, '初級'], [164, '中級'], [229, '上級'], [Infinity, '特級']],
    15: [[146, '上級'], [251, '特級'], [Infinity, '達人']],
    20: [[274, '上級'], [417, '特級'], [Infinity, '達人']],
    25: [[439, '特級'], [Infinity, '達人']]
  };
  function nearestSizeKey(n){
    var keys = [10, 15, 20, 25], best = keys[0], i;
    for (i = 0; i < keys.length; i++) {
      if (Math.abs(keys[i] - n) < Math.abs(best - n)) best = keys[i];
    }
    return best;
  }
  function tierOf(D, n){
    var cuts = TIER_CUTS[n] || TIER_CUTS[nearestSizeKey(n)];
    for (var i = 0; i < cuts.length; i++) {
      if (D < cuts[i][0]) return cuts[i][1];
    }
    return cuts[cuts.length - 1][1];
  }

  /* ---- 判定: この絵は問題になるか ----
     why: 'empty'  なにも塗られていません
          'ok'     これで作れます
          'multi'  答えが2通り以上あります
          'guess'  勘に頼らないと解けません */
  function rate(bits, w, h){
    var i, any = false;
    if (typeof bits !== 'string' || bits.length !== w * h) {
      return { ok:false, why:'empty', D:null, tier:null };
    }
    for (i = 0; i < bits.length; i++) { if (bits.charAt(i) === '1') { any = true; break; } }
    if (!any) return { ok:false, why:'empty', D:null, tier:null };

    var hs = hints(bits, w, h);
    var m = solveMetrics(hs.rowHints, hs.colHints, w, h);
    if (m.ok) {
      /* ラインソルバーが全マスを確定できた＝解は一つ、仮定も要らない */
      return {
        ok:true, why:'ok', D:m.D, tier:tierOf(m.D, Math.max(w, h)),
        P:m.P, W:m.W, R1:m.R1, S:m.S, rowHints:hs.rowHints, colHints:hs.colHints
      };
    }
    /* ここに来た時点で「行と列の伝播だけでは解けない」は確定している。
       さらに別解が見つかったときだけ、より具体的な 'multi' を返す。
       探索を打ち切った場合は 'guess' に留める（分からないことを言い切らない）。 */
    var cs = countSolutions(hs.rowHints, hs.colHints, w, h, 2);
    var why = (cs.count >= 2) ? 'multi' : 'guess';
    return {
      ok:false, why:why, D:m.D, tier:null,
      P:m.P, W:m.W, R1:m.R1, S:m.S, sols:cs.count, aborted:cs.aborted,
      rowHints:hs.rowHints, colHints:hs.colHints
    };
  }

  /* ---- 共有ハッシュ #p1.<w>.<h>.<base64url>.<名前> ---- */
  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function bitsToB64(bits){
    var out = '', i, j, chunk, n = bits.length;
    for (i = 0; i < n; i += 6) {
      chunk = 0;
      for (j = 0; j < 6; j++) chunk = (chunk << 1) | ((i + j < n && bits.charAt(i + j) === '1') ? 1 : 0);
      out += B64.charAt(chunk);
    }
    return out;
  }
  function b64ToBits(s, len){
    var out = '', i, j, v;
    for (i = 0; i < s.length; i++) {
      v = B64.indexOf(s.charAt(i));
      if (v < 0) return null;
      for (j = 5; j >= 0; j--) out += ((v >> j) & 1) ? '1' : '0';
    }
    if (out.length < len) return null;
    return out.slice(0, len);
  }
  var DEFAULT_TITLE = 'むだい';
  function encode(bits, w, h, title){
    var t = '';
    /* encodeURIComponent は '.' を残すので、区切りと混ざらないよう自分で %2E にする */
    try { t = encodeURIComponent(title || '').replace(/\./g, '%2E'); } catch (e) { t = ''; }
    return '#p1.' + w + '.' + h + '.' + bitsToB64(bits) + '.' + t;
  }
  function decode(hash){
    if (typeof hash !== 'string') return null;
    var s = hash.charAt(0) === '#' ? hash.slice(1) : hash;
    var p = s.split('.');
    if (p.length < 4 || p[0] !== 'p1') return null;
    var w = parseInt(p[1], 10), h = parseInt(p[2], 10);
    if (!(w >= 3 && w <= 40 && h >= 3 && h <= 40)) return null;
    var bits = b64ToBits(p[3], w * h);
    if (!bits) return null;
    var title = DEFAULT_TITLE;
    if (p.length > 4) {
      /* 古い形（'.' が生で入ったもの）でも壊れないよう、5つ目以降は '.' で繋ぎ直す */
      try { title = decodeURIComponent(p.slice(4).join('.')); } catch (e) { title = DEFAULT_TITLE; }
    }
    if (!title) title = DEFAULT_TITLE;
    return { bits: bits, w: w, h: h, title: title.slice(0, 24) };
  }

  var PixelTsukuru = {
    hints: hints,
    lineDeduce: lineDeduce,
    lineSolve: lineSolve,
    solveMetrics: solveMetrics,
    countSolutions: countSolutions,
    tierOf: tierOf,
    rate: rate,
    encode: encode,
    decode: decode,
    DEFAULT_TITLE: DEFAULT_TITLE
  };
  if (typeof window !== 'undefined') window.PixelTsukuru = PixelTsukuru;
  if (typeof globalThis !== 'undefined') globalThis.PixelTsukuru = PixelTsukuru;
  if (typeof module !== 'undefined' && module.exports) module.exports = PixelTsukuru;
})();
</script>

<script>
(function(){
  'use strict';
  var P = window.PixelTsukuru;

  var elMake = document.getElementById('makeScreen');
  var elPlay = document.getElementById('playScreen');
  var elBroken = document.getElementById('broken');
  var elBrokenWhy = document.getElementById('brokenWhy');
  var elSubName = document.getElementById('subName');
  var btnZoom = document.getElementById('zoomBtn');

  /* ---- 作る画面の部品 ---- */
  var elSizeRow = document.getElementById('sizeRow');
  var elMakeStage = document.getElementById('makeStage');
  var elMakeGrid = document.getElementById('makeGrid');
  var elTitleInput = document.getElementById('titleInput');
  var elVerdict = document.getElementById('verdict');
  var btnCheck = document.getElementById('checkBtn');
  var btnClear = document.getElementById('clearBtn');
  var btnUndoMake = document.getElementById('undoMakeBtn');
  var btnShare = document.getElementById('shareBtn');
  var elShareNote = document.getElementById('shareNote');
  var elMade = document.getElementById('made');
  var elMadeList = document.getElementById('madeList');

  /* ---- 解く画面の部品 ---- */
  var elPlayStage = document.getElementById('playStage');
  var elPlayGrid = document.getElementById('playGrid');
  var elPlayColHints = document.getElementById('playColHints');
  var elPlayRowHints = document.getElementById('playRowHints');
  var elClearBanner = document.getElementById('clearBanner');
  var elArtTitle = document.getElementById('artTitle');
  var btnModeFill = document.getElementById('modeFill');
  var btnModeCross = document.getElementById('modeCross');
  var btnUndo = document.getElementById('undoBtn');
  var btnReset = document.getElementById('resetBtn');
  var btnToMake = document.getElementById('toMakeBtn');
  var btnBroken = document.getElementById('brokenBtn');

  var SIZES = [10, 15, 20, 25];
  var mode = 'make';           // 'make' | 'play' | 'broken'
  var isZoomed = false;

  /* ================= 保存 ================= */
  var SAVE_KEY = 'pixel-tsukuru';
  var store = { made: [] };

  function loadStore(){
    try {
      var s = localStorage.getItem(SAVE_KEY);
      if (!s) return;
      var parsed = JSON.parse(s);
      if (parsed && Object.prototype.toString.call(parsed.made) === '[object Array]') {
        store.made = parsed.made.slice(0, 20);
      }
    } catch(e) { store.made = []; }
  }
  function persist(){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ made: store.made.slice(0, 20) })); } catch(e) {}
  }
  function remember(bits, w, h, title){
    var i;
    for (i = 0; i < store.made.length; i++) {
      if (store.made[i].bits === bits && store.made[i].w === w && store.made[i].h === h) {
        store.made.splice(i, 1);
        break;
      }
    }
    var d = new Date();
    var date = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    store.made.unshift({ bits: bits, w: w, h: h, title: title, date: date });
    if (store.made.length > 20) store.made.length = 20;
    persist();
    renderMade();
  }

  /* ================= マス寸法（index.html と同じ考え方） ================= */
  function sizeFor(stage, w, h, zoomed){
    var availWidth = Math.min(window.innerWidth - 32, 420);
    var cs, fs, hintPad = (stage === elPlayStage) ? true : false;
    if (zoomed) {
      cs = 24; fs = 11;
    } else {
      var pad = hintPad ? (w <= 10 ? 70 : (w <= 15 ? 85 : 95)) : 16;
      cs = Math.floor((availWidth - pad) / w);
      if (w <= 10) { if (cs > 28) cs = 28; if (cs < 22) cs = 22; fs = 11; }
      else if (w <= 15) { if (cs < 16) cs = 16; fs = 9.5; }
      else { if (cs < 11) cs = 11; fs = 8; }
      var availHeight = Math.max(260, Math.round(window.innerHeight * 0.58));
      var csH = Math.floor(availHeight / h);
      if (csH < cs) cs = csH;
      if (cs < 11) cs = 11;
    }
    stage.style.setProperty('--cs', cs + 'px');
    stage.style.setProperty('--hint-fs', fs + 'px');
  }

  function buildGrid(box, w, h){
    box.innerHTML = '';
    box.style.gridTemplateColumns = 'repeat(' + w + ', var(--cs))';
    box.style.gridTemplateRows = 'repeat(' + h + ', var(--cs))';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < h; i++) {
      for (var j = 0; j < w; j++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = String(i * w + j);
        cell.dataset.r = String(i);
        cell.dataset.c = String(j);
        if (j === w - 1) cell.classList.add('re');
        if (i === h - 1) cell.classList.add('be');
        if ((j + 1) % 5 === 0 && j !== w - 1) cell.classList.add('b-r5');
        if ((i + 1) % 5 === 0 && i !== h - 1) cell.classList.add('b-b5');
        frag.appendChild(cell);
      }
    }
    box.appendChild(frag);
  }

  function buildHints(colBox, rowBox, hs, w, h){
    colBox.innerHTML = '';
    colBox.style.gridTemplateColumns = 'repeat(' + w + ', var(--cs))';
    for (var c = 0; c < w; c++) {
      var colDiv = document.createElement('div');
      colDiv.className = 'colHint';
      if ((c + 1) % 5 === 0 && c !== w - 1) colDiv.classList.add('b-r5');
      appendHintNums(colDiv, hs.colHints[c]);
      colBox.appendChild(colDiv);
    }
    rowBox.innerHTML = '';
    rowBox.style.gridTemplateRows = 'repeat(' + h + ', var(--cs))';
    for (var r = 0; r < h; r++) {
      var rowDiv = document.createElement('div');
      rowDiv.className = 'rowHint';
      if ((r + 1) % 5 === 0 && r !== h - 1) rowDiv.classList.add('b-b5');
      appendHintNums(rowDiv, hs.rowHints[r]);
      rowBox.appendChild(rowDiv);
    }
  }
  function appendHintNums(box, nums){
    if (nums.length === 1 && nums[0] === 0) {
      var z = document.createElement('span');
      z.className = 'hintNum';
      z.textContent = '0';
      z.style.opacity = '0.35';
      box.appendChild(z);
      return;
    }
    for (var i = 0; i < nums.length; i++) {
      var s = document.createElement('span');
      s.className = 'hintNum';
      s.textContent = String(nums[i]);
      s.addEventListener('click', function(e){ e.stopPropagation(); this.classList.toggle('checked'); });
      box.appendChild(s);
    }
  }

  /* ================= 作る画面 ================= */
  var mw = 15, mh = 15;
  var draw = [];          // 0 空 / 1 塗り
  var drawHistory = [];
  var drawDragging = false, drawAction = 0, drawLast = -1;
  var lastVerdict = null;

  function renderSizeRow(){
    elSizeRow.innerHTML = '';
    for (var i = 0; i < SIZES.length; i++) {
      (function(n){
        var b = document.createElement('button');
        b.className = 'sizeBtn' + (n === mw ? ' cur' : '');
        b.textContent = n + '×' + n;
        b.addEventListener('click', function(){
          if (n === mw) return;
          if (hasInk() && !window.confirm('大きさを変えると描いた絵は消えます。よろしいですか？')) return;
          setSize(n);
        });
        elSizeRow.appendChild(b);
      })(SIZES[i]);
    }
  }
  function hasInk(){
    for (var i = 0; i < draw.length; i++) if (draw[i] === 1) return true;
    return false;
  }
  function setSize(n){
    mw = n; mh = n;
    draw = [];
    for (var i = 0; i < mw * mh; i++) draw.push(0);
    drawHistory = [];
    resetVerdict();
    renderSizeRow();
    sizeFor(elMakeStage, mw, mh, false);
    buildGrid(elMakeGrid, mw, mh);
    renderDraw();
  }
  function renderDraw(){
    var cells = elMakeGrid.children;
    for (var i = 0; i < cells.length; i++) cells[i].classList.toggle('fill', draw[i] === 1);
  }
  function resetVerdict(){
    lastVerdict = null;
    elVerdict.hidden = true;
    elVerdict.className = '';
    btnShare.hidden = true;
    elShareNote.textContent = '';
  }

  elMakeGrid.addEventListener('pointerdown', function(e){
    var cell = cellFromEvent(e, elMakeGrid);
    if (!cell) return;
    e.preventDefault();
    var idx = parseInt(cell.dataset.idx, 10);
    drawHistory.push(draw.slice());
    if (drawHistory.length > 50) drawHistory.shift();
    drawDragging = true;
    drawLast = idx;
    drawAction = (draw[idx] === 1) ? 0 : 1;
    draw[idx] = drawAction;
    resetVerdict();
    renderDraw();
  });
  window.addEventListener('pointermove', function(e){
    if (!drawDragging) return;
    var cell = cellFromEvent(e, elMakeGrid);
    if (!cell) return;
    var idx = parseInt(cell.dataset.idx, 10);
    if (idx === drawLast) return;
    drawLast = idx;
    draw[idx] = drawAction;
    renderDraw();
  });
  function endDrawDrag(){
    if (!drawDragging) return;
    drawDragging = false;
    drawLast = -1;
  }
  window.addEventListener('pointerup', endDrawDrag);
  window.addEventListener('pointercancel', endDrawDrag);

  btnClear.addEventListener('click', function(){
    if (!hasInk()) return;
    drawHistory.push(draw.slice());
    for (var i = 0; i < draw.length; i++) draw[i] = 0;
    resetVerdict();
    renderDraw();
  });
  btnUndoMake.addEventListener('click', function(){
    if (!drawHistory.length) return;
    draw = drawHistory.pop();
    resetVerdict();
    renderDraw();
  });

  function bitsOf(arr){
    var s = '';
    for (var i = 0; i < arr.length; i++) s += (arr[i] === 1) ? '1' : '0';
    return s;
  }

  var VERDICT_TEXT = {
    empty: ['なにも塗られていません', 'マスをタップして絵を描いてください。'],
    multi: ['答えが2通り以上あります', '数字だけでは絵が一つに決まりません。どこか1〜2マス塗り足すか削ると決まることが多いです。'],
    guess: ['勘に頼らないと解けません', '行と列の数字を追うだけでは最後まで行けません。塗りの塊を大きくするか、長く続く行か列を1本通すと解けるようになります。']
  };

  btnCheck.addEventListener('click', function(){
    btnCheck.disabled = true;
    btnCheck.textContent = 'しらべています…';
    /* 重い計算の前に一度画面を返す */
    setTimeout(function(){
      var bits = bitsOf(draw);
      var v = P.rate(bits, mw, mh);
      lastVerdict = v.ok ? { bits: bits, w: mw, h: mh, D: v.D, tier: v.tier } : null;
      elVerdict.hidden = false;
      if (v.ok) {
        elVerdict.className = 'ok';
        elVerdict.innerHTML = '<b>これで作れます</b><span class="note">むずかしさの目安: ' + v.tier + '</span>';
        btnShare.hidden = false;
        elShareNote.textContent = '';
      } else {
        elVerdict.className = 'ng';
        var t = VERDICT_TEXT[v.why] || VERDICT_TEXT.guess;
        elVerdict.innerHTML = '<b>' + t[0] + '</b><span class="note">' + t[1] + '</span>';
        btnShare.hidden = true;
        elShareNote.textContent = '';
      }
      btnCheck.disabled = false;
      btnCheck.textContent = 'たしかめる';
    }, 20);
  });

  function currentTitle(){
    var t = (elTitleInput.value || '').trim();
    return t ? t.slice(0, 24) : P.DEFAULT_TITLE;
  }
  function shareUrl(v, title){
    return location.origin + location.pathname + P.encode(v.bits, v.w, v.h, title);
  }

  btnShare.addEventListener('click', function(){
    if (!lastVerdict) return;
    var title = currentTitle();
    var url = shareUrl(lastVerdict, title);
    remember(lastVerdict.bits, lastVerdict.w, lastVerdict.h, title);

    function done(msg){ elShareNote.textContent = msg; }
    function copyFallback(){
      try {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok ? 'URLをコピーしました' : ('コピーできませんでした: ' + url));
      } catch(e) {
        done('コピーできませんでした: ' + url);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function(){ done('URLをコピーしました'); }, copyFallback);
    } else {
      copyFallback();
    }
    if (navigator.share) {
      try { navigator.share({ title: 'ピクセル｜' + title, url: url }); } catch(e) {}
    }
  });

  function renderMade(){
    if (!store.made.length) { elMade.hidden = true; return; }
    elMade.hidden = false;
    elMadeList.innerHTML = '';
    for (var i = 0; i < store.made.length; i++) {
      (function(item){
        var row = document.createElement('div');
        row.className = 'madeItem';
        var nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = item.title;
        var mt = document.createElement('span');
        mt.className = 'mt';
        mt.textContent = item.w + '×' + item.h + '　' + item.date;
        nm.appendChild(mt);
        var b = document.createElement('button');
        b.textContent = '開く';
        b.addEventListener('click', function(){
          mw = item.w; mh = item.h;
          draw = [];
          for (var k = 0; k < item.bits.length; k++) draw.push(item.bits.charAt(k) === '1' ? 1 : 0);
          drawHistory = [];
          elTitleInput.value = (item.title === P.DEFAULT_TITLE) ? '' : item.title;
          resetVerdict();
          renderSizeRow();
          sizeFor(elMakeStage, mw, mh, false);
          buildGrid(elMakeGrid, mw, mh);
          renderDraw();
          window.scrollTo(0, 0);
        });
        row.appendChild(nm);
        row.appendChild(b);
        elMadeList.appendChild(row);
      })(store.made[i]);
    }
  }

  /* ================= 解く画面 ================= */
  var puz = null;             // {bits,w,h,title,rowHints,colHints}
  var gridState = [];
  var history = [];
  var isCleared = false;
  var inputMode = 'fill';
  var isDragging = false, dragAction = null, lastTargetCell = -1;
  var activeRow = -1, activeCol = -1;

  function startPlay(p, hs){
    puz = p;
    puz.rowHints = hs.rowHints;
    puz.colHints = hs.colHints;
    gridState = [];
    for (var i = 0; i < p.w * p.h; i++) gridState.push(0);
    history = [];
    isCleared = false;
    activeRow = -1; activeCol = -1;
    inputMode = 'fill';
    btnModeFill.classList.add('active');
    btnModeCross.classList.remove('active');
    elPlayStage.classList.remove('cleared');
    elClearBanner.hidden = true;
    elSubName.textContent = p.w + '×' + p.h;

    btnZoom.hidden = !(p.w >= 15 || p.h >= 15);
    setZoom(false);
    renderPlayBoard();
  }
  function layoutPlay(){
    sizeFor(elPlayStage, puz.w, puz.h, isZoomed);
    buildHints(elPlayColHints, elPlayRowHints, { rowHints: puz.rowHints, colHints: puz.colHints }, puz.w, puz.h);
    buildGrid(elPlayGrid, puz.w, puz.h);
    renderPlayBoard();
  }
  function setZoom(z){
    isZoomed = z;
    elPlayStage.classList.toggle('zoomed', isZoomed);
    btnZoom.textContent = isZoomed ? '📱 全体' : '🔍 拡大';
    if (puz) layoutPlay();
  }
  btnZoom.addEventListener('click', function(){ setZoom(!isZoomed); });

  function renderPlayBoard(){
    var cells = elPlayGrid.children;
    for (var i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('fill', gridState[i] === 1);
      cells[i].classList.toggle('x', gridState[i] === 2);
    }
  }
  function updateCrosshair(r, c){
    if (r === activeRow && c === activeCol) return;
    activeRow = r; activeCol = c;
    var colNodes = elPlayColHints.children, i;
    for (i = 0; i < colNodes.length; i++) colNodes[i].classList.toggle('active', i === c);
    var rowNodes = elPlayRowHints.children;
    for (i = 0; i < rowNodes.length; i++) rowNodes[i].classList.toggle('active', i === r);
    var cells = elPlayGrid.children, w = puz.w;
    for (i = 0; i < cells.length; i++) {
      var cr = Math.floor(i / w), cc = i % w;
      var isRow = (cr === r), isCol = (cc === c);
      cells[i].classList.toggle('guide-row', isRow && !isCol);
      cells[i].classList.toggle('guide-col', isCol && !isRow);
      cells[i].classList.toggle('guide-cross', isRow && isCol);
    }
  }
  function clearCrosshair(){
    activeRow = -1; activeCol = -1;
    var i;
    var colNodes = elPlayColHints.children;
    for (i = 0; i < colNodes.length; i++) colNodes[i].classList.remove('active');
    var rowNodes = elPlayRowHints.children;
    for (i = 0; i < rowNodes.length; i++) rowNodes[i].classList.remove('active');
    var cells = elPlayGrid.children;
    for (i = 0; i < cells.length; i++) cells[i].classList.remove('guide-row', 'guide-col', 'guide-cross');
  }

  /* 判定: 塗ったマスが解とぴったり一致した瞬間だけ（途中で正誤は言わない） */
  function judge(){
    var bits = puz.bits;
    for (var i = 0; i < bits.length; i++) {
      if ((bits.charAt(i) === '1') !== (gridState[i] === 1)) return;
    }
    isCleared = true;
    clearCrosshair();
    elPlayStage.classList.add('cleared');
    elArtTitle.innerHTML = escapeHtml(puz.title) + ' <span>完成！</span>';
    elClearBanner.hidden = false;
  }
  function escapeHtml(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function cellFromEvent(e, box){
    var target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target || !target.closest) return null;
    var cell = target.closest('.cell');
    if (!cell || !box.contains(cell)) return null;
    return cell;
  }

  elPlayGrid.addEventListener('pointerdown', function(e){
    if (isCleared) return;
    var cell = cellFromEvent(e, elPlayGrid);
    if (!cell) return;
    var idx = parseInt(cell.dataset.idx, 10);
    e.preventDefault();
    isDragging = true;
    lastTargetCell = idx;
    history.push(gridState.slice());
    if (history.length > 50) history.shift();
    updateCrosshair(parseInt(cell.dataset.r, 10), parseInt(cell.dataset.c, 10));
    var cur = gridState[idx];
    dragAction = (inputMode === 'fill') ? ((cur === 1) ? 0 : 1) : ((cur === 2) ? 0 : 2);
    gridState[idx] = dragAction;
    renderPlayBoard();
  });
  window.addEventListener('pointermove', function(e){
    if (mode !== 'play' || isCleared) return;
    var cell = cellFromEvent(e, elPlayGrid);
    if (!cell) return;
    updateCrosshair(parseInt(cell.dataset.r, 10), parseInt(cell.dataset.c, 10));
    if (!isDragging) return;
    var idx = parseInt(cell.dataset.idx, 10);
    if (idx === lastTargetCell) return;
    lastTargetCell = idx;
    gridState[idx] = dragAction;
    renderPlayBoard();
  });
  function endPlayDrag(){
    if (!isDragging) return;
    isDragging = false;
    lastTargetCell = -1;
    judge();
  }
  window.addEventListener('pointerup', endPlayDrag);
  window.addEventListener('pointercancel', endPlayDrag);

  btnModeFill.addEventListener('click', function(){
    inputMode = 'fill';
    btnModeFill.classList.add('active');
    btnModeCross.classList.remove('active');
  });
  btnModeCross.addEventListener('click', function(){
    inputMode = 'cross';
    btnModeCross.classList.add('active');
    btnModeFill.classList.remove('active');
  });
  btnUndo.addEventListener('click', function(){
    if (isCleared || !history.length) return;
    gridState = history.pop();
    renderPlayBoard();
  });
  btnReset.addEventListener('click', function(){
    if (isCleared) return;
    history.push(gridState.slice());
    for (var i = 0; i < gridState.length; i++) gridState[i] = 0;
    renderPlayBoard();
  });

  function goMake(){
    if (location.hash) {
      try { history_replace(); } catch(e) {}
    }
    showMake();
    window.scrollTo(0, 0);
  }
  function history_replace(){
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', location.pathname + location.search);
    } else {
      location.hash = '';
    }
  }
  btnToMake.addEventListener('click', goMake);
  btnBroken.addEventListener('click', goMake);

  /* ================= 画面切り替え ================= */
  function showMake(){
    mode = 'make';
    elMake.hidden = false;
    elPlay.hidden = true;
    elBroken.hidden = true;
    btnZoom.hidden = true;
    elSubName.textContent = 'じぶんで作る';
    if (!draw.length) setSize(15);
    else { sizeFor(elMakeStage, mw, mh, false); buildGrid(elMakeGrid, mw, mh); renderDraw(); }
    renderMade();
  }
  function showPlay(){
    mode = 'play';
    elMake.hidden = true;
    elPlay.hidden = false;
    elBroken.hidden = true;
  }
  function showBroken(why){
    mode = 'broken';
    elMake.hidden = true;
    elPlay.hidden = true;
    elBroken.hidden = false;
    btnZoom.hidden = true;
    elSubName.textContent = '';
    elBrokenWhy.textContent = why;
  }

  window.addEventListener('resize', function(){
    if (mode === 'play' && puz) layoutPlay();
    else if (mode === 'make') { sizeFor(elMakeStage, mw, mh, false); }
  });

  /* ================= 起動 ================= */
  loadStore();

  function boot(){
    var hash = location.hash || '';
    if (hash.length <= 1) { showMake(); return; }
    var got = P.decode(hash);
    if (!got) {
      showBroken('URLが途中で切れているか、形が違います。');
      return;
    }
    /* 渡された盤を、その場でもう一度検証してから遊ばせる */
    var v = P.rate(got.bits, got.w, got.h);
    if (!v.ok) {
      var why = (v.why === 'empty') ? 'なにも塗られていません。'
              : (v.why === 'multi') ? '答えが2通り以上あるので、解ける問題になっていません。'
              : '行と列の数字だけでは解けない盤でした。';
      showBroken(why);
      return;
    }
    showPlay();
    startPlay(got, { rowHints: v.rowHints, colHints: v.colHints });
    layoutPlay();
  }
  /* アドレス欄に別の問題のURLを貼られたときも読み直す */
  window.addEventListener('hashchange', function(){ boot(); window.scrollTo(0, 0); });
  boot();
})();
</script>
</body>
</html>
