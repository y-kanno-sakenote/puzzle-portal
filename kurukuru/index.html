<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>くるくる</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#dedcd6; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --thick:#5d5952;
    --on:#2f6e9e; --off:#c6d2da;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:420px;margin:0 auto;padding:10px 10px 40px}
  header{display:flex;align-items:baseline;gap:8px;padding:2px 2px 8px}
  #title{font-size:20px;font-weight:700;letter-spacing:.02em}

  #rules{padding:0 2px 10px;font-size:13px;line-height:1.7;color:var(--sub)}
  #rules div{white-space:nowrap}

  #stage{position:relative}
  #board{
    position:relative;
    width:100%;max-width:400px;margin:0 auto;aspect-ratio:1/1;
    background:var(--panel);border:2px solid var(--thick);border-radius:6px;
    overflow:hidden;
    touch-action:none;                 /* 盤の上だけページを動かさない */
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    cursor:pointer;
  }
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cell{transition:transform .12s ease-out}

  #buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px}
  button{
    font:inherit;padding:11px 0;border:1px solid var(--frame);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{background:#eeece7}
  button:disabled{opacity:.4;cursor:default}

  #clear{
    position:absolute;left:0;right:0;top:0;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(245,244,241,.93);border-radius:6px;z-index:20;
  }
  #clear[hidden]{display:none}
  #clearTitle{font-size:26px;font-weight:700}
  #next{font-size:17px;padding:12px 28px}

  #levels{padding-top:18px}
  .tier{margin-bottom:10px}
  .tierName{font-size:13px;color:var(--sub);padding:2px 2px 4px}
  .tierRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .lv{padding:0;height:40px;font-size:14px;border-radius:7px;
      display:flex;align-items:center;justify-content:center}
  .lv.cur{border-color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><div id="title">入門 1</div></header>

  <div id="rules">
    <div>マスをタップすると時計回りに回る</div>
    <div>全部のパイプをつないで一本の網にする</div>
  </div>

  <div id="stage">
    <div id="board"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="clear" hidden>
      <div id="clearTitle">クリア！</div>
      <button id="next">つぎへ</button>
    </div>
  </div>

  <div id="buttons">
    <button id="undo">もどす</button>
    <button id="reset">はじめから</button>
  </div>

  <section id="levels"></section>
</div>

/* PUZZLES-END */

var Kurukuru = (function () {

  var HEX = "0123456789abcdef";
  var VARCACHE = {};

  /* 時計回りに times 回（90度ずつ）。times は負でもよい */
  function rotate(cell, times) {
    var m = cell & 15, t = ((times | 0) % 4 + 4) % 4, i;
    for (i = 0; i < t; i++) m = ((m << 1) | (m >> 3)) & 15;
    return m;
  }

  /* 向きの重複を同一視した「異なる向き」の一覧
     十字は1個、直線は2個、端・かど・三叉は4個 */
  function variants(m) {
    m = m & 15;
    if (VARCACHE[m]) return VARCACHE[m];
    var out = [], x = m, i;
    for (i = 0; i < 4; i++) {
      if (out.indexOf(x) < 0) out.push(x);
      x = rotate(x, 1);
    }
    VARCACHE[m] = out;
    return out;
  }

  function decode(s) {
    var out = [], i;
    for (i = 0; i < s.length; i++) out.push(HEX.indexOf(s.charAt(i)));
    return out;
  }
  function encode(cells) {
    var out = "", i;
    for (i = 0; i < cells.length; i++) out += HEX.charAt(cells[i] & 15);
    return out;
  }

  /* 問題 -> {n, N, cells:[出題の向き], sol:[正解の向き]} */
  function parse(p) {
    return { n: p.n, N: p.n * p.n, cells: decode(p.cells), sol: decode(p.solution) };
  }

  /* 左上の隅のマス（0番）から腕でつながっているマスの集合。
     つながりは両側に腕があるときだけ数える（片方だけの腕はつながっていない） */
  function connectedSet(cells, n) {
    var N = n * n, seen = new Set(), stack = [0], i, r, c, m;
    if (!N) return seen;
    seen.add(0);
    while (stack.length) {
      i = stack.pop();
      r = Math.floor(i / n); c = i % n; m = cells[i];
      if ((m & 1) && r > 0 && (cells[i - n] & 4) && !seen.has(i - n)) { seen.add(i - n); stack.push(i - n); }
      if ((m & 4) && r < n - 1 && (cells[i + n] & 1) && !seen.has(i + n)) { seen.add(i + n); stack.push(i + n); }
      if ((m & 8) && c > 0 && (cells[i - 1] & 2) && !seen.has(i - 1)) { seen.add(i - 1); stack.push(i - 1); }
      if ((m & 2) && c < n - 1 && (cells[i + 1] & 8) && !seen.has(i + 1)) { seen.add(i + 1); stack.push(i + 1); }
    }
    return seen;
  }

  /* 腕が過不足なくつながり（腕の先に必ず相手の腕がある・盤の外へ出ていない）、
     かつ全体が一つの網になっているか */
  function isSolved(cells, n) {
    var N = n * n, i, r, c, m;
    if (!cells || cells.length !== N) return false;
    for (i = 0; i < N; i++) {
      r = Math.floor(i / n); c = i % n; m = cells[i];
      if ((m & 1) && (r === 0 || !(cells[i - n] & 4))) return false;
      if ((m & 4) && (r === n - 1 || !(cells[i + n] & 1))) return false;
      if ((m & 8) && (c === 0 || !(cells[i - 1] & 2))) return false;
      if ((m & 2) && (c === n - 1 || !(cells[i + 1] & 8))) return false;
    }
    return connectedSet(cells, n).size === N;
  }

  /* 解を limit 個まで数える（生成器 tools/gen_puzzles.py と同じ枝刈り）
     数えるのは「異なる向きの組み合わせ」＝異なる接続のしかた。
     行優先でマスを決め、
       ・縁のマスは外向きの腕を持てない
       ・左・上の決まったマスと、向かい合う辺の腕の有無が一致すること
       ・輪ができたら打ち切る
       ・まだ決めていない領域へ腕が1本も向いていない塊ができたら打ち切る
     で枝を刈る */
  function countSolutions(p, limit) {
    limit = limit || 2;
    var n = p.n, N = n * n, base = decode(p.cells), i, r, c, j, m;
    var allowed = [];
    for (i = 0; i < N; i++) {
      r = Math.floor(i / n); c = i % n;
      var vs = variants(base[i]), keep = [];
      for (j = 0; j < vs.length; j++) {
        m = vs[j];
        if (r === 0 && (m & 1)) continue;
        if (r === n - 1 && (m & 4)) continue;
        if (c === 0 && (m & 8)) continue;
        if (c === n - 1 && (m & 2)) continue;
        keep.push(m);
      }
      if (!keep.length) return 0;
      allowed.push(keep);
    }

    var parent = [], sz = [], opn = [], cur = [], log = [];
    for (i = 0; i < N; i++) { parent.push(i); sz.push(1); opn.push(0); cur.push(0); }
    var cnt = 0;

    function find(x) { while (parent[x] !== x) x = parent[x]; return x; }
    function rollback(mark) {
      while (log.length > mark) {
        var e = log.pop();
        if (e[0] === 0) opn[e[1]] = e[2];
        else if (e[0] === 1) parent[e[1]] = e[2];
        else sz[e[1]] = e[2];
      }
    }

    function dfs(i) {
      if (cnt >= limit) return;
      if (i === N) { if (sz[find(0)] === N) cnt++; return; }
      var r = Math.floor(i / n), c = i % n;
      var up = r > 0 ? i - n : -1, lf = c > 0 ? i - 1 : -1;
      var needN = up >= 0 ? (cur[up] & 4) !== 0 : false;
      var needW = lf >= 0 ? (cur[lf] & 2) !== 0 : false;
      var list = allowed[i], k, m, mark, o, ok, ra, rb, t;
      for (k = 0; k < list.length; k++) {
        if (cnt >= limit) return;
        m = list[k];
        if (up >= 0 && ((m & 1) !== 0) !== needN) continue;
        if (lf >= 0 && ((m & 8) !== 0) !== needW) continue;
        cur[i] = m;
        mark = log.length;
        o = 0;
        if (c + 1 < n && (m & 2)) o++;
        if (r + 1 < n && (m & 4)) o++;
        log.push([0, i, opn[i]]); opn[i] = o;
        ok = true;
        var pairs = [[up, 1], [lf, 8]], q;
        for (q = 0; q < 2; q++) {
          var nb = pairs[q][0], bit = pairs[q][1];
          if (nb < 0 || !(m & bit)) continue;
          ra = find(i); rb = find(nb);
          log.push([0, rb, opn[rb]]); opn[rb]--;      /* 相手の外向きの腕を1本使い切る */
          if (ra === rb) { ok = false; break; }       /* 輪ができた */
          if (sz[ra] < sz[rb]) { t = ra; ra = rb; rb = t; }
          log.push([1, rb, parent[rb]]); parent[rb] = ra;
          log.push([2, ra, sz[ra]]); sz[ra] += sz[rb];
          log.push([0, ra, opn[ra]]); opn[ra] += opn[rb];
        }
        if (ok && i + 1 < N && opn[find(i)] === 0) ok = false;  /* もう広がれない塊 */
        if (ok) dfs(i + 1);
        rollback(mark);
      }
    }

    dfs(0);
    return cnt;
  }

  return {
    PUZZLES: PUZZLES, HEX: HEX,
    parse: parse, rotate: rotate, variants: variants,
    decode: decode, encode: encode,
    connectedSet: connectedSet, isSolved: isSolved, countSolutions: countSolutions
  };
})();

if (typeof window !== 'undefined') window.Kurukuru = Kurukuru;
if (typeof globalThis !== 'undefined') globalThis.Kurukuru = Kurukuru;
</script>

  })();

  /* ---- 保存 ---- */
  var save = { cleared: {}, last: 0, rot: {} };
  function loadSave() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.cleared && typeof o.cleared === 'object') save.cleared = o.cleared;
      if (Number.isInteger(o.last) && o.last >= 0 && o.last < PUZZLES.length) save.last = o.last;
      if (o.rot && typeof o.rot === 'object') save.rot = o.rot;
    } catch (e) { save = { cleared: {}, last: 0, rot: {} }; }
  }
  function storeSave() {
    try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
  }

  /* ---- 状態 ---- */
  var index = 0, p = null, d = null, n = 0, N = 0;
  var base = [];      /* 出題時の各マスの向き（回転0のときの見た目） */
  var turn = [];      /* 時計回りに何回まわしたか。増え続ける（見た目が常に時計回りになる） */
  var groups = [];    /* マスごとの <g> */
  var history = [];   /* タップしたマス番号。もどす＝1手戻し */
  var finished = false;

  function maskAt(i) { return Kurukuru.rotate(base[i], turn[i]); }
  function currentCells() {
    var out = [], i;
    for (i = 0; i < N; i++) out.push(maskAt(i));
    return out;
  }

  /* ---- 盤を組む ---- */
  function buildBoard() {
    while (elSvg.firstChild) elSvg.removeChild(elSvg.firstChild);
    elSvg.setAttribute('viewBox', '0 0 ' + (n * CELL) + ' ' + (n * CELL));
    groups = [];
    var i, e;

    /* 目盛りの線。vector-effect は継承されないので1本ずつ付ける */
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('stroke', 'rgba(0,0,0,.08)');
    function gline(x1, y1, x2, y2) {
      var t = document.createElementNS(SVGNS, 'line');
      t.setAttribute('x1', x1); t.setAttribute('y1', y1);
      t.setAttribute('x2', x2); t.setAttribute('y2', y2);
      t.setAttribute('stroke-width', '1');
      t.setAttribute('vector-effect', 'non-scaling-stroke');
      g.appendChild(t);
    }
    for (i = 1; i < n; i++) {
      gline(i * CELL, 0, i * CELL, n * CELL);
      gline(0, i * CELL, n * CELL, i * CELL);
    }
    elSvg.appendChild(g);

    var W = Math.max(10, Math.round(CELL * (n <= 6 ? 0.20 : 0.17)));
    for (i = 0; i < N; i++) {
      var r = Math.floor(i / n), c = i % n;
      var cx = c * CELL + CELL / 2, cy = r * CELL + CELL / 2;
      var m = base[i], arms = 0, bit;
      var cg = document.createElementNS(SVGNS, 'g');
      cg.setAttribute('class', 'cell');
      cg.setAttribute('stroke-width', W);
      cg.setAttribute('stroke-linecap', 'round');
      cg.style.transformOrigin = cx + 'px ' + cy + 'px';
      for (bit = 0; bit < 4; bit++) if (m & (1 << bit)) arms++;
      function arm(x2, y2) {
        var t = document.createElementNS(SVGNS, 'line');
        t.setAttribute('x1', cx); t.setAttribute('y1', cy);
        t.setAttribute('x2', x2); t.setAttribute('y2', y2);
        cg.appendChild(t);
      }
      if (m & 1) arm(cx, cy - CELL / 2);
      if (m & 4) arm(cx, cy + CELL / 2);
      if (m & 8) arm(cx - CELL / 2, cy);
      if (m & 2) arm(cx + CELL / 2, cy);
      /* 中心の丸。端（腕1本）は大きめにして「ここで行き止まり」と分かるようにする */
      e = document.createElementNS(SVGNS, 'circle');
      e.setAttribute('cx', cx); e.setAttribute('cy', cy);
      e.setAttribute('r', arms === 1 ? Math.round(W * 1.05) : Math.round(W * 0.52));
      e.setAttribute('stroke', 'none');
      cg.appendChild(e);
      elSvg.appendChild(cg);
      groups.push(cg);
    }
  }

  function render() {
    var cells = currentCells();
    var lit = Kurukuru.connectedSet(cells, n);
    var i, col;
    for (i = 0; i < N; i++) {
      col = lit.has(i) ? 'var(--on)' : 'var(--off)';
      groups[i].setAttribute('stroke', col);
      groups[i].setAttribute('fill', col);
      groups[i].style.transform = 'rotate(' + (turn[i] * 90) + 'deg)';
    }
    elUndo.disabled = finished || !history.length;
  }

  function persist() {
    save.rot[String(index)] = Kurukuru.encode(currentCells());
    save.last = index;
    storeSave();
  }

  /* 保存した向きを回転回数に読み戻す。読めなければ出題のまま */
  function restore(str) {
    if (typeof str !== 'string' || str.length !== N) return null;
    var got = Kurukuru.decode(str), out = [], i, t, ok;
    for (i = 0; i < N; i++) {
      if (!(got[i] >= 0 && got[i] <= 15)) return null;
      ok = -1;
      for (t = 0; t < 4; t++) if (Kurukuru.rotate(base[i], t) === got[i]) { ok = t; break; }
      if (ok < 0) return null;
      out.push(ok);
    }
    return out;
  }

  /* ---- 出題 ---- */
  function loadLevel(i) {
    index = i;
    p = PUZZLES[i];
    d = Kurukuru.parse(p);
    n = d.n; N = d.N;
    base = d.cells.slice();
    turn = [];
    for (var k = 0; k < N; k++) turn.push(0);
    history = [];
    finished = false;
    elClear.hidden = true;
    elTitle.textContent = LABELS[i].text;
    buildBoard();
    var got = restore(save.rot && save.rot[String(i)]);
    if (got) turn = got;
    render();
    renderLevelList();
    save.last = i;
    storeSave();
  }

  /* ---- 操作 ---- */
  /* 指の位置からマス番号。盤の座標から求める（要素からではなく） */
  function cellAt(x, y) {
    var r = elSvg.getBoundingClientRect();
    if (!r.width || !r.height) return -1;
    var cw = r.width / n, ch = r.height / n;
    var c = Math.floor((x - r.left) / cw), rw = Math.floor((y - r.top) / ch);
    if (c < 0 || c > n - 1 || rw < 0 || rw > n - 1) return -1;
    return rw * n + c;
  }

  function tap(i) {
    turn[i]++;                       /* 見た目は常に時計回り。論理は 4 で割った余り */
    history.push(i);
    if (history.length > 500) history.shift();
    render();
    persist();
    judge();
  }

  elBoard.addEventListener('pointerdown', function (e) {
    if (finished) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    tap(i);
  });

  /* 全部の腕がつながり一つの網になった瞬間だけクリア（途中では何も言わない） */
  function judge() {
    if (!Kurukuru.isSolved(currentCells(), n)) return;
    finished = true;
    save.cleared[String(index)] = 1;
    persist();
    renderLevelList();
    render();
    elNext.hidden = (index >= PUZZLES.length - 1);
    elClear.hidden = false;
  }

  elUndo.addEventListener('click', function () {
    if (finished || !history.length) return;
    var i = history.pop();
    turn[i]--;
    render();
    persist();
  });
  elReset.addEventListener('click', function () {
    for (var i = 0; i < N; i++) turn[i] = 0;
    history = [];
    finished = false;
    elClear.hidden = true;
    render();
    persist();
  });
  elNext.addEventListener('click', function () {
    if (index < PUZZLES.length - 1) { loadLevel(index + 1); window.scrollTo(0, 0); }
  });

  /* ---- レベル一覧 ---- */
  function renderLevelList() {
    if (!elLevels.childNodes.length) {
      var tiers = [], seen = {}, i;
      for (i = 0; i < LABELS.length; i++) {
        if (!seen[LABELS[i].tier]) { seen[LABELS[i].tier] = []; tiers.push(LABELS[i].tier); }
        seen[LABELS[i].tier].push(i);
      }
      for (var t = 0; t < tiers.length; t++) {
        var box = document.createElement('div');
        box.className = 'tier';
        var name = document.createElement('div');
        name.className = 'tierName';
        name.textContent = tiers[t];
        box.appendChild(name);
        var row = document.createElement('div');
        row.className = 'tierRow';
        var idxs = seen[tiers[t]];
        for (var k = 0; k < idxs.length; k++) {
          var b = document.createElement('button');
          b.className = 'lv';
          b.dataset.idx = String(idxs[k]);
          b.addEventListener('click', function () {
            loadLevel(parseInt(this.dataset.idx, 10));
            window.scrollTo(0, 0);
          });
          row.appendChild(b);
        }
        box.appendChild(row);
        elLevels.appendChild(box);
      }
    }
    var btns = elLevels.querySelectorAll('.lv');
    for (var j = 0; j < btns.length; j++) {
      var idx = parseInt(btns[j].dataset.idx, 10);
      btns[j].textContent = LABELS[idx].no + (save.cleared[String(idx)] ? ' ✓' : '');
      btns[j].className = 'lv' + (idx === index ? ' cur' : '');
    }
  }

  loadSave();
  loadLevel(save.last);
})();
</script>
</body>
</html>
