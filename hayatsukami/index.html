<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はやつかみ</title>
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --line:#dedcd6; --frame:#c9c6be;
    --ink:#2b2b2b; --sub:#77736c; --thick:#5d5952;
    --item:min(120px,30vh,14vw); --gap:min(20px,3vw); --motif:min(64px,16vh,8vw);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* 上下の陣。上側は 180 度回して相手から読めるようにする */
  .side{flex:0 0 26%;width:100%;position:relative;display:flex;align-items:center;justify-content:center}
  .side.top{transform:rotate(180deg)}

  .card{
    position:relative;
    display:flex;align-items:center;gap:min(16px,3vw);
    padding:min(10px,2vh) min(18px,3vw);
    background:var(--panel);border:2px solid var(--thick);border-radius:14px;
    min-width:calc(var(--motif) * 2 + 60px);min-height:calc(var(--motif) + 20px);
    justify-content:center;
  }
  .card svg{width:var(--motif);height:var(--motif);display:block}
  .card.taken{border-color:var(--frame);opacity:.25}
  .card.taken.showingCue{opacity:1}   /* 合図の数字を出している間は枠を薄くしない */

  /* 取った枚数は自分側の端に置く */
  .count{position:absolute;left:min(18px,3vw);top:50%;transform:translateY(-50%);
         font-size:min(26px,6vh);font-weight:700;line-height:1;color:var(--ink)}
  .count small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}

  /* 中央：品が5つ横一列 */
  #mid{flex:1 1 auto;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:min(6px,1vh);touch-action:none}
  #items{width:100%;display:flex;justify-content:center;gap:var(--gap)}
  .item{width:var(--item);height:var(--item);display:flex;align-items:center;justify-content:center;
        transition:transform .13s ease-out}
  .item.hold{transition:none}
  .item svg{width:100%;height:100%;display:block;pointer-events:none}

  .note{height:17px;font-size:12px;line-height:17px;color:var(--sub);text-align:center}
  .note.top{transform:rotate(180deg)}

  /* 始まりの合図（3→2→1）。札が出る瞬間を二人に予告するだけのもので、制限時間ではない。
     上下の札の枠（.card）の中に数字を出し、0 になった瞬間に同じ枠へ札を出す
     （「次はここに出る」が形で伝わる）。中央の品には一切かからない。
     上側は .side.top の 180 度回転をそのまま受け継ぐので、追加の回転指定は要らない。
     指の邪魔をしないよう当たり判定は持たない（pointer-events:none） */
  .cueNum{position:absolute;inset:0;pointer-events:none;
          display:flex;align-items:center;justify-content:center;
          font-size:calc((var(--motif) + 20px) * .65);font-weight:800;line-height:1;color:var(--thick)}

  #rotate{position:fixed;left:0;right:0;top:0;z-index:40;display:none;
          padding:4px;text-align:center;font-size:12px;color:var(--sub);background:var(--bg)}
  @media (orientation:portrait){ #rotate{display:block} }

  #over{position:fixed;inset:0;z-index:30;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(14px,3vh);
        background:rgba(245,244,241,.94)}
  #over[hidden]{display:none}
  .res{font-size:min(26px,6vh);font-weight:700;text-align:center}
  .res.top{transform:rotate(180deg)}
  .res span{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  button{
    font:inherit;padding:12px 28px;border:1px solid var(--frame);
    border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{background:#eeece7}

  #helpBtn{position:fixed;right:min(14px,2vw);top:min(14px,2vh);z-index:36;
           width:28px;height:28px;margin:0;padding:0;border-radius:50%;
           font:inherit;font-size:14px;font-weight:700;line-height:1;
           border:1px solid var(--frame);background:var(--panel);color:var(--sub);
           display:flex;align-items:center;justify-content:center;
           cursor:pointer;-webkit-tap-highlight-color:transparent}
  #helpBtn:active{background:#eeece7}

  #helpPanel{position:fixed;inset:0;z-index:35;
             display:flex;flex-direction:column;align-items:center;justify-content:space-between;
             background:rgba(245,244,241,.96);padding:min(28px,5vh) min(24px,5vw);
             cursor:pointer}
  #helpPanel[hidden]{display:none}
  .helpText{font-size:14px;line-height:1.9;text-align:center;color:var(--ink);max-width:min(92vw,440px)}
  .helpText.top{transform:rotate(180deg)}
</style>
</head>
<body>
<div id="rotate">横にしてください</div>

<div id="app">
  <div class="side top">
    <div class="count" id="countTop">0<small>枚</small></div>
    <div class="card" id="cardTop"></div>
  </div>

  <div id="mid">
    <div class="note top" id="noteTop"></div>
    <div id="items"></div>
    <div class="note" id="noteBottom"></div>
  </div>

  <div class="side bottom">
    <div class="count" id="countBottom">0<small>枚</small></div>
    <div class="card" id="cardBottom"></div>
  </div>
</div>

<div id="over" hidden>
  <div class="res top" id="resTop"></div>
  <button id="again">もう一回</button>
  <div class="res" id="resBottom"></div>
</div>

<button id="helpBtn" type="button" aria-label="あそびかた">？</button>
<div id="helpPanel" hidden>
  <div class="helpText top">
    形と色が正しい品が1つあれば、それを取る<br>
    無ければ、形も色も札に出ていない品を取る<br>
    正しい品を自分の側へ引く。早い方が取る<br>
    まちがえたら1枚相手にわたす
  </div>

var Hayatsukami = (function () {

  /* 品は5つ。形と色が1対1 */
  var SHAPES = ["はな", "ダイヤ", "ろっかく", "リボン", "わ"];
  var COLORS = ["赤", "青", "黄", "緑", "黒"];
  var TRUE = { "はな": "赤", "ダイヤ": "青", "ろっかく": "黄", "リボン": "緑", "わ": "黒" };
  var OWNER = { "赤": "はな", "青": "ダイヤ", "黄": "ろっかく", "緑": "リボン", "黒": "わ" };

  function motif(m) {
    if (!m || m.length !== 2) return null;
    if (!TRUE.hasOwnProperty(m[0]) || !OWNER.hasOwnProperty(m[1])) return null;
    return m;
  }

  /* 札の正解（正解の形）を返す。定まらない札は null
       1. 形と色が本来の組み合わせと一致する絵柄がちょうど1つ → その品
       2. 一致が0個 → 形としても色としても出ていない品が1つ残る → その品
     一致が2つある札（v0.1 では使わない）と、残りが1つに絞れない札は null */
  function answerOf(card) {
    if (!card) return null;
    var a = motif(card.a), b = motif(card.b);
    if (!a || !b) return null;
    if (a[0] === b[0]) return null;                 /* 形の重複 */
    if (a[1] === b[1]) return null;                 /* 色の重複 */
    var hit = [];
    if (TRUE[a[0]] === a[1]) hit.push(a[0]);
    if (TRUE[b[0]] === b[1]) hit.push(b[0]);
    if (hit.length === 2) return null;
    if (hit.length === 1) return hit[0];
    var used = {}, rest = [], i;
    used[a[0]] = 1; used[b[0]] = 1;
    used[OWNER[a[1]]] = 1; used[OWNER[b[1]]] = 1;
    for (i = 0; i < SHAPES.length; i++) if (!used[SHAPES[i]]) rest.push(SHAPES[i]);
    if (rest.length !== 1) return null;
    return rest[0];
  }

  /* 正解が1つに定まる札か */
  function isValidCard(card) {
    return answerOf(card) !== null;
  }

  /* ---- 引きの判定（DOM に依存しない） ----
     しきい値を越えた最初の引きが、その札を取る。待ち時間も猶予窓も置かない。
     ・札が場に出ていない間（配り待ち）も指は置けるが、しきい値は越えられない
     ・札が配られた瞬間に、そのとき押されている指の起点をその場に置き直す
     ・札が変わった瞬間に、触れている指はすべて無効。いったん離すまで戻らない */
  var Grab = {
    create: function () { return { pointers: {}, open: false }; },

    down: function (st, id, idx, x, y) {
      st.pointers[id] = { idx: idx, x0: x, y0: y, x: x, y: y, off: 0, dead: false, done: false };
      return st.pointers[id];
    },

    /* しきい値を越えたら {side, idx} を返す。越えていなければ null */
    move: function (st, id, x, y, th) {
      var p = st.pointers[id];
      if (!p) return null;
      p.x = x; p.y = y;
      if (p.dead || p.done || !st.open) { p.off = 0; return null; }
      var dx = x - p.x0, dy = y - p.y0;
      p.off = Math.max(-th, Math.min(th, dy));
      if (Math.abs(dy) >= th && Math.abs(dy) > Math.abs(dx)) {   /* 横に引いても無効 */
        p.done = true;                                          /* この札への引きは1回きり */
        p.off = 0;
        return { side: dy < 0 ? 'top' : 'bottom', idx: p.idx };
      }
      return null;
    },

    up: function (st, id) { delete st.pointers[id]; },

    /* 札が出た。押されたままの指は起点をその場に置き直す（無効な指は無効のまま） */
    deal: function (st) {
      st.open = true;
      for (var id in st.pointers) if (st.pointers.hasOwnProperty(id)) {
        var p = st.pointers[id];
        p.x0 = p.x; p.y0 = p.y; p.off = 0;
      }
    },

    /* 札が場から消えた。触れている指はすべて無効にする（次の札へ持ち越さない） */
    clear: function (st) {
      st.open = false;
      for (var id in st.pointers) if (st.pointers.hasOwnProperty(id)) {
        st.pointers[id].dead = true;
        st.pointers[id].off = 0;
      }
    },

    reset: function (st) { st.pointers = {}; st.open = false; },

    /* 描画用。いま引かれている量を品ごとに返す（無効・使用済みの指は 0） */
    offsets: function (st, n) {
      var off = [], i, id, p;
      for (i = 0; i < n; i++) off.push(0);
      for (id in st.pointers) if (st.pointers.hasOwnProperty(id)) {
        p = st.pointers[id];
        if (p.dead || p.done) continue;
        if (p.idx >= 0 && p.idx < n) off[p.idx] = p.off;
      }
      return off;
    }
  };

  return {
    CARDS: CARDS, SHAPES: SHAPES, COLORS: COLORS, TRUE: TRUE, OWNER: OWNER,
    answerOf: answerOf, isValidCard: isValidCard, Grab: Grab
  };
})();

if (typeof window !== 'undefined') window.Hayatsukami = Hayatsukami;
if (typeof globalThis !== 'undefined') globalThis.Hayatsukami = Hayatsukami;
</script>

<script>
/* =====================================================================
   画面
   ===================================================================== */
if (typeof document !== 'undefined') (function () {
  var KEY = 'hayatsukami';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var GOAL = 7;          /* 先に7枚で勝ち */
  var GAP = 600;         /* 決着の表示までの間（ミリ秒） */
  var CUE = 600;         /* 始まりの合図の1数字あたり（ミリ秒）。3→2→1 で合計 1.8 秒 */

  var SHAPES = Hayatsukami.SHAPES;
  var TRUE = Hayatsukami.TRUE;
  var CARDS = Hayatsukami.CARDS;

  var PAINT = { "赤": "#d94f43", "青": "#2f7fd4", "黄": "#e0a90c", "緑": "#3f9b52", "黒": "#2b2b2b" };

  /* 形は単純な輪郭で（100×100 の枠に描く）。
     向かい合って遊ぶので、**5つとも 180 度回すと自分自身に重なる形**に限る
     （上の人だけ逆さまに見えると見つける速さに差が出て不公平になる）。
     tools/check_symmetry.py が index.html のこの PATH を読んで機械で点検する */
  var PATH = {
    "はな":     { d: "M50 35A15 15 0 1 1 50 65A15 15 0 1 1 50 35Z M50 2A19 19 0 1 1 50 40A19 19 0 1 1 50 2Z M98 50A19 19 0 1 1 60 50A19 19 0 1 1 98 50Z M50 98A19 19 0 1 1 50 60A19 19 0 1 1 50 98Z M2 50A19 19 0 1 1 40 50A19 19 0 1 1 2 50Z" },
    "ダイヤ":   { d: "M50 5L79 50 50 95 21 50Z" },
    "ろっかく": { d: "M5 50L27 13 73 13 95 50 73 87 27 87Z" },
    "リボン":   { d: "M11 11L50 50 11 89Z M89 11L50 50 89 89Z" },
    "わ":       { d: "M50 7A43 43 0 1 0 50 93A43 43 0 1 0 50 7Z M50 29A21 21 0 1 0 50 71A21 21 0 1 0 50 29Z", rule: "evenodd" }
  };

  function drawMotif(shape, color) {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', PATH[shape].d);
    p.setAttribute('fill', PAINT[color]);
    if (PATH[shape].rule) p.setAttribute('fill-rule', PATH[shape].rule);
    svg.appendChild(p);
    return svg;
  }

  var elItems = document.getElementById('items');
  var elMid = document.getElementById('mid');
  var elCard = { top: document.getElementById('cardTop'), bottom: document.getElementById('cardBottom') };
  var elCount = { top: document.getElementById('countTop'), bottom: document.getElementById('countBottom') };
  var elNote = { top: document.getElementById('noteTop'), bottom: document.getElementById('noteBottom') };
  var elOver = document.getElementById('over');
  var elRes = { top: document.getElementById('resTop'), bottom: document.getElementById('resBottom') };
  var elAgain = document.getElementById('again');

  /* 始まりの合図の数字。上下それぞれの札の枠（cardTop/cardBottom）の中に出す。
     showCard() が箱の中身を丸ごと入れ替えるので、札が出る瞬間に自動で消える */
  var cueNum = { top: document.createElement('div'), bottom: document.createElement('div') };
  cueNum.top.className = 'cueNum';
  cueNum.bottom.className = 'cueNum';
  function cue(text) {
    ['top', 'bottom'].forEach(function (side) {
      var el = cueNum[side], box = elCard[side];
      if (text) {
        el.textContent = text;
        if (el.parentNode !== box) box.appendChild(el);
        box.classList.add('showingCue');
      } else {
        if (el.parentNode) el.parentNode.removeChild(el);
        box.classList.remove('showingCue');
      }
    });
  }

  /* ---- 保存（通算の勝ち数と、あそびかたを見たかどうかだけ） ---- */
  var store = { wins: { top: 0, bottom: 0 }, seen: 0 };
  function loadStore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object' || !o.wins || typeof o.wins !== 'object') return;
      if (Number.isInteger(o.wins.top) && o.wins.top >= 0) store.wins.top = o.wins.top;
      if (Number.isInteger(o.wins.bottom) && o.wins.bottom >= 0) store.wins.bottom = o.wins.bottom;
      if (o.seen) store.seen = 1;
    } catch (e) { store = { wins: { top: 0, bottom: 0 }, seen: 0 }; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify({ wins: store.wins, seen: store.seen })); } catch (e) {}
  }

  /* ---- あそびかた（初回だけ自動、以降は？ボタン） ---- */
  var elHelpBtn = document.getElementById('helpBtn');
  var elHelpPanel = document.getElementById('helpPanel');
  function showHelp() { elHelpPanel.hidden = false; }
  function hideHelp() {
    elHelpPanel.hidden = true;
    if (!store.seen) { store.seen = 1; saveStore(); }
  }
  elHelpPanel.addEventListener('click', hideHelp);
  elHelpBtn.addEventListener('click', showHelp);

  /* ---- 状態 ---- */
  var items = [];                       /* 品の見た目（左から SHAPES の順） */
  var score = { top: 0, bottom: 0 };
  var deck = [], cursor = 0;
  var card = null;                      /* いま出ている札 / null＝間 */
  var locked = true;                    /* 入力を受けない間 */
  var over = false;
  var Grab = Hayatsukami.Grab;
  var grab = Grab.create();             /* 指の状態と先着判定（DOM 非依存） */
  var noteTimer = { top: 0, bottom: 0 };
  var cueTimers = [];                   /* 合図と配り（3→2→1→札） */

  var HINT = '正しい品を自分の側へ引く';

  function other(side) { return side === 'top' ? 'bottom' : 'top'; }

  /* ---- 品を並べる ---- */
  (function build() {
    for (var i = 0; i < SHAPES.length; i++) {
      var d = document.createElement('div');
      d.className = 'item';
      d.appendChild(drawMotif(SHAPES[i], TRUE[SHAPES[i]]));
      elItems.appendChild(d);
      items.push(d);
    }
  })();

  /* ---- 札 ---- */
  function shuffleDeck() {
    deck = [];
    for (var i = 0; i < CARDS.length; i++) deck.push(i);
    for (i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = deck[i];
      deck[i] = deck[j]; deck[j] = t;
    }
    cursor = 0;
  }

  function showCard(c) {
    ['top', 'bottom'].forEach(function (side) {
      var box = elCard[side];
      while (box.firstChild) box.removeChild(box.firstChild);
      if (!c) { box.className = 'card taken'; return; }
      box.className = 'card';
      box.appendChild(drawMotif(c.a[0], c.a[1]));
      box.appendChild(drawMotif(c.b[0], c.b[1]));
    });
  }

  function deal() {
    if (over) return;
    cue('');
    if (cursor >= deck.length) shuffleDeck();
    card = CARDS[deck[cursor++]];
    showCard(card);
    Grab.deal(grab);          /* 押されたままの指は起点をここに置き直す */
    offsets();
    locked = false;
  }

  function nextCard() {
    card = null;
    showCard(null);
    Grab.clear(grab);         /* 札が変わる。触れている指はいったん無効 */
    offsets();
    countdown();
  }

  function clearDeal() {
    for (var i = 0; i < cueTimers.length; i++) clearTimeout(cueTimers[i]);
    cueTimers = [];
  }

  /* 始まりの合図。3 を出してから 1 数字ずつ進め、0 になった瞬間に札を出す。
     合図の間は札が場に無いので、品に触れても引いても何も起きない（judge は card が無ければ戻る）。
     札を出すのは deal() のままなので、押されたままの指の起点を置き直す仕組みはそのまま効く */
  function countdown() {
    clearDeal();
    cue('3');
    cueTimers.push(setTimeout(function () { cue('2'); }, CUE));
    cueTimers.push(setTimeout(function () { cue('1'); }, CUE * 2));
    cueTimers.push(setTimeout(deal, CUE * 3));
  }

  /* ---- 表示 ---- */
  function renderCount() {
    ['top', 'bottom'].forEach(function (side) {
      elCount[side].innerHTML = score[side] + '<small>枚</small>';
    });
  }
  function note(side, text, hold) {
    elNote[side].textContent = text;
    clearTimeout(noteTimer[side]);
    if (hold) noteTimer[side] = setTimeout(function () { elNote[side].textContent = HINT; }, hold);
  }
  function resetNotes() { note('top', HINT); note('bottom', HINT); }

  function offsets() {
    var off = Grab.offsets(grab, 5);
    for (var i = 0; i < 5; i++) {
      items[i].style.transform = off[i] ? 'translateY(' + off[i] + 'px)' : '';
      if (off[i]) items[i].classList.add('hold'); else items[i].classList.remove('hold');
    }
  }

  /* ---- 判定 ---- */
  function judge(side, idx) {
    if (!card || locked || over) return;
    var want = Hayatsukami.answerOf(card);
    if (SHAPES[idx] === want) {
      locked = true;
      score[side] += 1;
      renderCount();
      note(side, 'とった！', 1200);
      note(other(side), '', 1200);
      if (score[side] >= GOAL) { finish(side); return; }
      nextCard();
    } else {
      /* おてつき＝自分の持ち札を1枚相手に渡す（0枚なら何も起きない） */
      if (score[side] > 0) {
        score[side] -= 1;
        score[other(side)] += 1;
        renderCount();
        note(side, 'おてつき　1枚わたす', 1200);
        if (score[other(side)] >= GOAL) { locked = true; finish(other(side)); return; }
      } else {
        note(side, 'おてつき', 1200);
      }
    }
  }

  function finish(winner) {
    over = true;
    locked = true;
    clearDeal();
    cue('');
    Grab.reset(grab); offsets();
    store.wins[winner] += 1;
    saveStore();
    setTimeout(function () {
      elRes[winner].innerHTML = 'かち<span>通算 ' + store.wins[winner] + ' 勝</span>';
      elRes[other(winner)].innerHTML = 'まけ<span>通算 ' + store.wins[other(winner)] + ' 勝</span>';
      elOver.hidden = false;
    }, GAP);
  }

  /* ---- 操作（Pointer Events。pointerId ごとに別々に追う） ----
     しきい値を越えた瞬間にその場で決める。待ちも猶予窓も置かない。 */

  /* 当たり判定は要素ではなく品の列の座標から求める（列を5等分し、隙間は両隣で分ける） */
  function hitItem(x, y) {
    var band = elMid.getBoundingClientRect(), row = elItems.getBoundingClientRect();
    if (y < band.top || y > band.bottom) return -1;
    if (x < row.left || x > row.right || !row.width) return -1;
    var i = Math.floor((x - row.left) / (row.width / 5));
    if (i < 0) i = 0;
    if (i > 4) i = 4;
    return i;
  }
  function threshold() {
    var r = elItems.getBoundingClientRect();
    return Math.max(18, r.height / 2);           /* 引く距離＝品の高さの半分 */
  }

  /* 札が出る前から指を置いてよい（置いても得はしない。起点は配布時に置き直される） */
  elMid.addEventListener('pointerdown', function (e) {
    if (over) return;
    var idx = hitItem(e.clientX, e.clientY);
    if (idx < 0) return;
    e.preventDefault();
    try { elMid.setPointerCapture(e.pointerId); } catch (err) {}
    Grab.down(grab, e.pointerId, idx, e.clientX, e.clientY);
  });

  elMid.addEventListener('pointermove', function (e) {
    if (!grab.pointers[e.pointerId]) return;
    e.preventDefault();
    var hit = Grab.move(grab, e.pointerId, e.clientX, e.clientY, threshold());
    offsets();
    if (hit) judge(hit.side, hit.idx);       /* 引き切った瞬間に即決 */
  });

  function release(e) {
    if (!grab.pointers[e.pointerId]) return;
    Grab.up(grab, e.pointerId);
    offsets();
  }
  elMid.addEventListener('pointerup', release);
  elMid.addEventListener('pointercancel', release);

  /* ---- はじめから ---- */
  function start() {
    score.top = 0; score.bottom = 0;
    over = false; locked = true; card = null;
    Grab.reset(grab);
    elOver.hidden = true;
    renderCount();
    resetNotes();
    showCard(null);
    offsets();
    shuffleDeck();
    countdown();          /* 1局の最初も同じ合図から始める */
  }

  elAgain.addEventListener('click', start);

  loadStore();
  start();
  if (!store.seen) showHelp();
})();
</script>
